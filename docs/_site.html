<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factory Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Template for factory docs: it inlines docs/*.md into docs/index.html. Edit this file, not index.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
/* Layout: workshop manual. Sidebar of stations (Empezar as numbered steps), the page in the middle,
   "on this page" on the right. Safety orange marks where you are and what to do; green marks a check that passed. */
:root {
  --bg: #fcfcfb; --bg-side: #f5f4f1; --bg-code: #f2f0ec; --bg-hover: #ebe8e2;
  --fg: #1b1a17; --fg-muted: #67635c; --border: #e4e0d9;
  --accent: #c2410c; --accent-soft: #fdeee3; --on-accent: #ffffff;
  --ok: #2b7a3b; --ok-soft: #e9f6ec;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --side-w: 272px; --toc-w: 220px; --head-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --bg-side: #191815; --bg-code: #1f1e1a; --bg-hover: #26241f;
    --fg: #ecebe7; --fg-muted: #a29e95; --border: #2d2b26;
    --accent: #ff8a3d; --accent-soft: #2e1d11; --on-accent: #1b1208;
    --ok: #6fcf86; --ok-soft: #14261a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --bg-side: #191815; --bg-code: #1f1e1a; --bg-hover: #26241f;
  --fg: #ecebe7; --fg-muted: #a29e95; --border: #2d2b26;
  --accent: #ff8a3d; --accent-soft: #2e1d11; --on-accent: #1b1208;
  --ok: #6fcf86; --ok-soft: #14261a; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--head-h) + 16px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15.5px/1.65 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; height: var(--head-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: baseline; gap: 10px; color: var(--fg); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand b { font: 700 19px/1 var(--font-display); letter-spacing: -.01em; }
.brand code { font: 500 13px/1 var(--font-mono); color: var(--accent); }
.brand code::before { content: "$ "; color: var(--fg-muted); }
.brand small { font-size: 13px; color: var(--fg-muted); }
.search { position: relative; flex: 1; min-width: 0; max-width: 380px; margin-left: auto; }
#search { width: 100%; padding: 7px 34px 7px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-side); color: var(--fg); font: inherit; font-size: 14px; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 12px/1 var(--font-mono);
  color: var(--fg-muted); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; background: var(--bg); }
header button { flex-shrink: 0; border: 1px solid var(--border); background: var(--bg-side); color: var(--fg); border-radius: 6px;
  height: 34px; min-width: 34px; cursor: pointer; font: inherit; font-size: 15px; }
header button:hover { background: var(--bg-hover); }
#menu { display: none; }

.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--toc-w); }
nav#side { position: sticky; top: calc(var(--head-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--head-h)); overflow-y: auto;
  padding: 12px 12px 32px max(12px, env(safe-area-inset-left, 0px)); background: var(--bg-side); border-right: 1px solid var(--border); }
nav#side .group { margin: 20px 10px 6px; font: 600 12px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); }
nav#side a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; color: var(--fg-muted); font-size: 14px; line-height: 1.35; }
nav#side a:hover { background: var(--bg-hover); text-decoration: none; color: var(--fg); }
nav#side a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav#side .num { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid currentColor; font: 500 11px/1 var(--font-mono); opacity: .8; }
nav#side a.active .num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); opacity: 1; }
nav#side .hits { margin-left: auto; font: 12px var(--font-mono); opacity: .8; }
nav#side .empty { padding: 8px 10px; color: var(--fg-muted); }

main { min-width: 0; padding-block: 36px 96px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); }
article { max-width: 760px; margin: 0 auto; }
.crumb { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font: 600 12px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); }
.crumb .bar { flex: 1; max-width: 180px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
.crumb .bar i { display: block; height: 100%; background: var(--accent); }
.crumb .of { color: var(--accent); }
article h1 { font: 700 38px/1.1 var(--font-display); letter-spacing: -.02em; margin: 0 0 18px; text-wrap: balance; }
article h1 + p { font-size: 18px; line-height: 1.55; color: var(--fg-muted); max-width: 62ch; }
article h2 { font: 600 24px/1.25 var(--font-display); margin: 48px 0 12px; letter-spacing: -.01em; text-wrap: balance; }
article h3 { font: 600 18px/1.3 var(--font-display); margin: 30px 0 8px; }
article p, article li { max-width: 68ch; }
article li { margin: 4px 0; }
article strong { font-weight: 600; }
article h2 a.anchor, article h3 a.anchor { margin-left: 8px; opacity: 0; color: var(--fg-muted); font-weight: 400; }
article h2:hover a.anchor, article h3:hover a.anchor { opacity: 1; }
article code { font: 13.5px/1.5 var(--font-mono); background: var(--bg-code); padding: 1px 5px; border-radius: 4px; }
article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--fg-muted); }

/* Code blocks: a tab with what it is (terminal, workspace.json…) and a copy button. */
.code { margin: 18px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-code); overflow: hidden; }
.code .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 14px;
  border-bottom: 1px solid var(--border); font: 500 12px/1 var(--font-mono); color: var(--fg-muted); }
.code .bar button { border: 1px solid var(--border); background: var(--bg); color: var(--fg-muted); border-radius: 5px;
  padding: 4px 9px; font: 500 12px/1 var(--font-body); cursor: pointer; }
.code .bar button:hover { color: var(--fg); }
.code .bar button.done { color: var(--ok); border-color: var(--ok); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code pre code { background: none; padding: 0; font-size: 13.5px; line-height: 1.6; }
.code.term pre code { color: var(--fg); }

.table-wrap { overflow-x: auto; margin: 18px 0; border: 1px solid var(--border); border-radius: 8px; }
article table { border-collapse: collapse; width: 100%; font-size: 14px; }
article th, article td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--border); }
article th { background: var(--bg-side); font: 600 13px/1.3 var(--font-display); letter-spacing: .02em; white-space: nowrap; }
article tr:last-child td { border-bottom: 0; }
article td:first-child { white-space: nowrap; }

/* Getting-started pages: each "## N. Paso" becomes a station on a vertical rail. */
section.step { position: relative; margin-left: 15px; padding: 2px 0 8px 34px; border-left: 2px solid var(--border); }
section.step.last { border-left-color: transparent; }
section.step > h2 { margin-top: 0; padding-top: 32px; }
section.step:first-of-type > h2 { padding-top: 0; }
section.step .n { position: absolute; left: -16px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--accent); color: var(--accent); font: 600 14px/1 var(--font-mono); margin-top: -2px; }
section.check { margin: 40px 0 0; padding: 4px 20px 8px; border: 1px solid var(--ok); border-radius: 8px; background: var(--ok-soft); }
section.check > h2 { margin-top: 14px; font-size: 19px; color: var(--ok); }
section.check > h2::before { content: "✓ "; }

.mermaid svg { max-width: 100%; max-height: 72vh; height: auto; }
.mermaid { margin: 22px 0; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); text-align: center; overflow-x: auto; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); }
.pager a { padding: 14px 18px; border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font: 600 16px/1.3 var(--font-display); }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager small { display: block; margin-bottom: 4px; color: var(--fg-muted); font: 500 12px/1 var(--font-body); }
.pager .next { grid-column: 2; text-align: right; }
.pager .next.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pager .next.go small { color: inherit; opacity: .85; }
mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px; }

aside#toc { position: sticky; top: calc(var(--head-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--head-h)); overflow-y: auto;
  padding: 36px max(16px, env(safe-area-inset-right, 0px)) 32px 16px; font-size: 13px; }
aside#toc .label { font: 600 12px/1 var(--font-display); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
aside#toc a { display: block; padding: 4px 0 4px 12px; color: var(--fg-muted); border-left: 2px solid var(--border); line-height: 1.35; }
aside#toc a.h3 { padding-left: 24px; }
aside#toc a:hover { color: var(--fg); text-decoration: none; }
aside#toc a.active { color: var(--accent); border-left-color: var(--accent); }

@media (max-width: 1180px) { .layout { grid-template-columns: var(--side-w) minmax(0, 1fr); } aside#toc { display: none; } }
@media (max-width: 820px) {
  #menu { display: block; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav#side { position: fixed; left: 0; width: min(300px, 85vw); z-index: 9; transform: translateX(-100%); transition: transform .2s; }
  body.menu-open nav#side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand small, .search kbd { display: none; }
  .search { max-width: none; }
  article h1 { font-size: 30px; }
  section.step { padding-left: 26px; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { nav#side { transition: none; } }
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Menu" aria-expanded="false">☰</button>
  <a class="brand" href="#inicio"><b>Factory</b><code>factory</code><small>docs</small></a>
  <div class="search">
    <input id="search" type="search" placeholder="Search the docs" aria-label="Search">
    <kbd>/</kbd>
  </div>
  <button id="theme" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
</header>
<div class="layout">
  <nav id="side" aria-label="Pages"></nav>
  <main><article id="content"></article></main>
  <aside id="toc" aria-label="On this page"></aside>
</div>
<script id="pages" type="application/json">/*PAGES*/[]</script>
<script>
const PAGES = JSON.parse(document.getElementById('pages').textContent)
const $ = (s) => document.querySelector(s)
// GitHub-style heading ids, so links like 24-calidad.md#gate keep working.
const slug = (t) => t.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s/g, '-')
// Pages are grouped by the first digit of their file name: 1x Empezar (numbered steps), 2x Conceptos, 3x Referencia.
const GROUPS = { 1: 'Empezar', 2: 'Conceptos', 3: 'Referencia' }
const STEPS = PAGES.filter((p) => p.id[0] === '1')
const num = (p) => p.id[0] === '1' ? String(STEPS.indexOf(p) + 1) : ''
const label = (p) => p.id === 'inicio' ? 'Home' : p.title.replace(/`/g, '')
const CODE_LABEL = { sh: 'terminal', bash: 'terminal', json: 'json', text: 'output', markdown: 'markdown', toml: 'toml', yaml: 'yaml' }

// Theme: system by default, a manual choice is remembered on this browser.
const stored = (() => { try { return localStorage.getItem('docs-theme') } catch { return null } })()
if (stored) document.documentElement.dataset.theme = stored
const isDark = () => document.documentElement.dataset.theme === 'dark' ||
  (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)
$('#theme').onclick = () => {
  const next = isDark() ? 'light' : 'dark'
  document.documentElement.dataset.theme = next
  try { localStorage.setItem('docs-theme', next) } catch {}
  route()
}

function sidebar(query = '') {
  const q = query.trim().toLowerCase()
  let last = null
  $('#side').innerHTML = PAGES.map((p) => {
    const hits = q ? p.md.toLowerCase().split(q).length - 1 : 0
    if (q && !hits) return ''
    const g = GROUPS[p.id[0]], head = g && g !== last ? `<div class="group">${g}</div>` : ''
    last = g
    const n = num(p)
    return head + `<a href="#${p.id}" data-id="${p.id}">${n ? `<span class="num">${n}</span>` : ''}${label(p)}${q ? `<span class="hits">${hits}</span>` : ''}</a>`
  }).join('') || '<p class="empty">No results</p>'
  markActive()
}
const currentId = () => decodeURIComponent(location.hash.slice(1)) || 'inicio'
function markActive() {
  document.querySelectorAll('#side a').forEach((a) => a.classList.toggle('active', a.dataset.id === currentId()))
}

// Wraps each "## …" and what follows it, up to the next "##", in a <section>.
function sections(el) {
  [...el.querySelectorAll(':scope > h2')].forEach((h) => {
    const s = document.createElement('section')
    h.before(s)
    let n = h
    while (n && !(n !== h && n.tagName === 'H2')) { const next = n.nextElementSibling; s.append(n); n = next }
  })
  return [...el.querySelectorAll(':scope > section')]
}

let pendingAnchor = null
async function route() {
  const i = Math.max(0, PAGES.findIndex((p) => p.id === currentId()))
  const page = PAGES[i]
  const el = $('#content')
  el.innerHTML = marked.parse(page.md, { gfm: true })

  // Links between pages → #page (an anchor travels in data-anchor); links outside docs/ stay relative files.
  el.querySelectorAll('a[href]').forEach((a) => {
    const m = a.getAttribute('href').match(/^(?:\.\/)?([\w-]+)\.md(?:#(.*))?$/)
    if (m) { a.href = `#${m[1] === 'README' ? 'inicio' : m[1]}`; if (m[2]) a.dataset.anchor = decodeURIComponent(m[2]) }
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener' }
  })
  el.querySelectorAll('table').forEach((t) => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.append(t) })

  // Mermaid blocks; every other block gets its label bar and a copy button.
  el.querySelectorAll('code.language-mermaid').forEach((c) => { const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent; c.parentElement.replaceWith(d) })
  el.querySelectorAll('pre').forEach((pre) => {
    const lang = ((pre.firstElementChild?.className || '').match(/language-(\w+)/) || [])[1] || ''
    const box = document.createElement('div')
    box.className = 'code' + (CODE_LABEL[lang] === 'terminal' ? ' term' : '')
    box.innerHTML = `<div class="bar"><span>${CODE_LABEL[lang] || lang || 'code'}</span><button type="button">Copy</button></div>`
    pre.replaceWith(box); box.append(pre)
  })

  const heads = [...el.querySelectorAll('h2, h3')]
  heads.forEach((h) => { h.id = slug(h.textContent); h.dataset.label = h.textContent; h.insertAdjacentHTML('beforeend', `<a class="anchor" href="#${page.id}" data-anchor="${h.id}" aria-label="Link to this section">#</a>`) })

  // Getting-started pages: progress, numbered steps on a rail, and the closing check.
  const step = STEPS.indexOf(page)
  if (step >= 0) {
    el.insertAdjacentHTML('afterbegin', `<div class="crumb">Empezar <span class="bar"><i style="width:${(step + 1) / STEPS.length * 100}%"></i></span><span class="of">Paso ${step + 1} de ${STEPS.length}</span></div>`)
    sections(el).forEach((s) => {
      const h = s.firstElementChild, m = h.firstChild.nodeValue?.match(/^(\d+)\.\s*/)
      if (m) { s.className = 'step'; h.firstChild.nodeValue = h.firstChild.nodeValue.slice(m[0].length); h.insertAdjacentHTML('afterbegin', `<span class="n">${m[1]}</span>`) }
      else if (/^Comprobar/.test(h.textContent)) s.className = 'check'
    })
    ;[...el.querySelectorAll('section.step')].pop()?.classList.add('last')
  }

  // Highlight the search term on the page.
  const q = $('#search').value.trim()
  if (q) {
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: (n) => n.parentElement.closest('pre, .mermaid, .bar') ? 2 : 1 })
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), nodes = []
    while (walk.nextNode()) if (re.test(walk.currentNode.nodeValue)) nodes.push(walk.currentNode)
    nodes.forEach((n) => { const s = document.createElement('span'); s.innerHTML = n.nodeValue.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]).replace(re, (x) => `<mark>${x}</mark>`); n.replaceWith(s) })
  }

  mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'neutral', securityLevel: 'strict', fontFamily: 'IBM Plex Sans, system-ui, sans-serif' })
  await mermaid.run({ nodes: el.querySelectorAll('.mermaid') }).catch(() => {})

  // Previous / next. On the getting-started path, "next" is the call to action.
  const prev = PAGES[i - 1], next = PAGES[i + 1]
  const tag = (p, dir) => p.id[0] === '1' ? `${dir} · Paso ${num(p)}` : dir
  el.insertAdjacentHTML('beforeend', `<nav class="pager">${prev ? `<a href="#${prev.id}"><small>${tag(prev, '← Previous')}</small>${label(prev)}</a>` : ''}${next ? `<a class="next${step >= 0 || page.id === 'inicio' ? ' go' : ''}" href="#${next.id}"><small>${tag(next, 'Next →')}</small>${label(next)}</a>` : ''}</nav>`)

  // On-this-page table of contents, highlighting the section in view.
  $('#toc').innerHTML = heads.length ? '<div class="label">On this page</div>' + heads.map((h) => `<a class="${h.tagName.toLowerCase()}" href="#${page.id}" data-anchor="${h.id}">${h.dataset.label}</a>`).join('') : ''
  document.title = page.id === 'inicio' ? 'Factory Docs' : `${label(page)} · Factory Docs`
  markActive()
  document.body.classList.remove('menu-open'); $('#menu').setAttribute('aria-expanded', 'false')
  const target = pendingAnchor && document.getElementById(pendingAnchor)
  pendingAnchor = null
  target ? target.scrollIntoView() : window.scrollTo(0, 0)
}

// Section links: the hash only names the page; the section is scrolled to here.
document.addEventListener('click', (e) => {
  const copy = e.target.closest('.code .bar button')
  if (copy) {
    const text = copy.closest('.code').querySelector('pre').innerText
    const done = () => { copy.textContent = 'Copied'; copy.classList.add('done'); setTimeout(() => { copy.textContent = 'Copy'; copy.classList.remove('done') }, 1600) }
    const select = () => { const r = document.createRange(); r.selectNodeContents(copy.closest('.code').querySelector('pre')); getSelection().removeAllRanges(); getSelection().addRange(r) }
    try { navigator.clipboard.writeText(text).then(done, select) } catch { select() }
    return
  }
  const a = e.target.closest('a[data-anchor]')
  if (!a) return
  e.preventDefault()
  const page = a.getAttribute('href').slice(1)
  if (page === currentId()) document.getElementById(a.dataset.anchor)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
  else { pendingAnchor = a.dataset.anchor; location.hash = page }
})
addEventListener('scroll', () => {
  let cur = null
  document.querySelectorAll('#content h2, #content h3').forEach((h) => { if (h.getBoundingClientRect().top < 120) cur = h.id })
  document.querySelectorAll('#toc a').forEach((a) => a.classList.toggle('active', a.dataset.anchor === cur))
}, { passive: true })
addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#search').focus() }
  if (e.key === 'Escape' && document.activeElement === $('#search')) { $('#search').value = ''; sidebar(); route(); $('#search').blur() }
})

$('#search').addEventListener('input', (e) => { sidebar(e.target.value); route() })
$('#menu').onclick = () => { const open = document.body.classList.toggle('menu-open'); $('#menu').setAttribute('aria-expanded', String(open)) }
addEventListener('hashchange', route)
// Old links (#/page/anchor) still land on the page.
if (location.hash.startsWith('#/')) { const [p, a] = location.hash.slice(2).split('/'); pendingAnchor = a ? decodeURIComponent(a) : null; history.replaceState(null, '', '#' + p) }
sidebar(); route()
</script>
</body>

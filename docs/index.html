/* Layout: workshop manual. Sidebar of stations (Empezar as numbered steps), the page in the middle,

  --bg: #fcfcfb; --bg-side: #f5f4f1; --bg-code: #f2f0ec; --bg-hover: #ebe8e2;
  --fg: #1b1a17; --fg-muted: #67635c; --border: #e4e0d9;

  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --side-w: 272px; --toc-w: 220px; --head-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --bg-side: #191815; --bg-code: #1f1e1a; --bg-hover: #26241f;
    --fg: #ecebe7; --fg-muted: #a29e95; --border: #2d2b26;
    --accent: #ff8a3d; --accent-soft: #2e1d11; --on-accent: #1b1208;
    --ok: #6fcf86; --ok-soft: #14261a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --bg-side: #191815; --bg-code: #1f1e1a; --bg-hover: #26241f;
  --fg: #ecebe7; --fg-muted: #a29e95; --border: #2d2b26;
  --accent: #ff8a3d; --accent-soft: #2e1d11; --on-accent: #1b1208;
  --ok: #6fcf86; --ok-soft: #14261a; color-scheme: dark;
}
* { box-sizing: border-box; }

body { margin: 0; background: var(--bg); color: var(--fg); font: 15.5px/1.65 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; height: var(--head-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: baseline; gap: 10px; color: var(--fg); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand b { font: 700 19px/1 var(--font-display); letter-spacing: -.01em; }
.brand code { font: 500 13px/1 var(--font-mono); color: var(--accent); }
.brand code::before { content: "$ "; color: var(--fg-muted); }
.brand small { font-size: 13px; color: var(--fg-muted); }
.search { position: relative; flex: 1; min-width: 0; max-width: 380px; margin-left: auto; }
#search { width: 100%; padding: 7px 34px 7px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-side); color: var(--fg); font: inherit; font-size: 14px; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 12px/1 var(--font-mono);
  color: var(--fg-muted); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; background: var(--bg); }

  height: 34px; min-width: 34px; cursor: pointer; font: inherit; font-size: 15px; }

<script id="pages" type="application/json">[{"id": "inicio", "file": "README.md", "title": "The factory", "md": "# The factory\n\nThe factory turns a request (\"add X to screen Y\", a ticket) into a **reviewed and tested PR**. A team of Claude Code agents carries it from start to finish: spec, plan, implementation, gate, review, tests and delivery. You approve at the points you choose.\n\nUp to date with commit `ae12141` (2026-11-01) · `factory` kit 0.33.0. To bring them up to date: the `docs-sync` skill; `factory docs --check` warns about anything that appears on no page.\n\n## Start here\n\nSix steps, in order. In one afternoon you have your first PR.\n\n| | Step | What you get |\n|---|---|---|\n| 1 | [Install](10-instalar.md) | The `factory` command and the Herdr shortcuts |\n| 2 | [Create a hub](11-crear-un-hub.md) | Your project's folder, with its repos |\n| 3 | [Configure](12-configurar.md) | `workspace.json`: repos, gate and approvals |\n| 4 | [Start up](13-arrancar.md) | The orchestrator running with its panels |\n| 5 | [Your first task](14-primera-tarea.md) | From one sentence to a PR |\n| 6 | [Day to day](15-dia-a-dia.md) | Inbox, panels, shortcuts |\n\n## Engine and hubs\n\n| | What it is | Where |\n|---|---|---|\n| **Engine** | Agents, skills, hooks and MCP (`kit/`), scripts (`bin/`), panels, OpenSpec schema, hub template and these docs. One for all projects. | `code-factory/` |\n| **Hub** | One folder per project: `workspace.json`, `AGENTS.md` (repo map), `context/`, `learnings/`, `openspec/`, the linked repos and the task state (`.board/`, `.tasks/`). | Wherever you like; created with `factory hub-init` |\n\nA change in the engine reaches every hub immediately: there is no build or copy. Anything that only applies to one project is marked as **Example**; a complete example hub is in `examples/`.\n\n## Who does what\n\n- **Orchestrator** (Sonnet, Herdr `hub` workspace): receives requests, decides repos and branches, launches one coordinator per task. It doesn't implement.\n- **Coordinator** (Opus, one workspace per task): spec → plan → workers → gate → review and tests → PR. It doesn't write code.\n- **Subagents** (Sonnet/Haiku, or Opus depending on risk): specker, scout, ui-designer, worker, reviewer, tester, ui-tester.\n- **Jared**, **auditor** and **changelog**: separate sessions to create tasks in the task manager (if the hub has one), audit repos and write the period's changelog with videos of what's new.\n- **Kit** (`kit/`): the `factory` Claude Code plugin, with all the agents, skills, hooks and the `local-db` MCP.\n- **Scripts** (`bin/`, via `factory <command>`): prepare repos, environments and checks without spending tokens; the agents call them.\n\n## The rest of the documentation\n\n**Concepts**: how it works inside. [Architecture](20-arquitectura.md), [Task lifecycle](21-ciclo-de-una-tarea.md), [Repos, worktrees and environments](22-repos-worktrees-entornos.md), [Spec and plan](23-spec-y-plan.md), [Quality](24-calidad.md), [Delivery](25-entrega.md), [Audits, task manager and learnings](26-auditorias-tareas-aprendizajes.md), [Hubs, sessions and extensions](27-hubs-y-sesiones.md).\n\n**Reference**: for looking something specific up. [Tools](30-herramientas.md) (commands, panels, hooks, MCP), [Configuration](31-configuracion.md) (every `workspace.json` key), [Agents](32-agentes.md), [Known limits](33-limites.md).\n\n**Guide**: [Best practices](34-best-practices.md): safety, verification, keeping instructions short and trying Code Mode.\n\nThe web version of these pages: `factory docs` (the `.md` files are the source; the template is `docs/_site.html`).\n"}, {"id": "10-instalar", "file": "10-instalar.md", "title": "Install", "md": "# Install\n\nBy the end of this page you will have the `factory` command in your terminal and Herdr with the factory shortcuts. You do this once per machine; hubs come afterwards.\n\n## Before you start\n\nYou need macOS (the scripts use BSD `sed` and `open`) and a Claude account with Claude Code.\n\n| Tool | What for | Install |\n|---|---|---|\n| [Claude Code](https://claude.com/claude-code) | Every agent is a `claude` session | `curl -fsSL https://claude.ai/install.sh \\| bash` |\n| Herdr | Terminal multiplexer where the orchestrator, the coordinators and the panels live | The `herdr` binary on your `PATH` (tested with 0.9.5) |\n| [OpenSpec](https://github.com/Fission-AI/OpenSpec) | The spec for each task | `npm i -g @fission-ai/openspec` |\n| `git`, `jq`, `python3`, `node` | The engine scripts and the `local-db` MCP | `brew install jq node python` |\n| `gh` | PRs, checks and review comments | `brew install gh` and `gh auth login` |\n| `fzf`, `git-delta`, `lazygit`, `neovim` | Panels, diff and editor for tasks | `brew install fzf git-delta lazygit neovim` |\n\nOptional: [Ghostty](https://ghostty.org) for `factory open` (one window per hub), Docker if the hub uses a local DB (`localDb`), and `cursor-agent` to switch the kit to Cursor when your Claude usage runs out.\n\n## 1. The engine\n\nPut the `code-factory` repo wherever you like and link its command:\n\n```sh\ngit clone <engine-url> ~/code-factory\nmkdir -p ~/.local/bin\nln -s ~/code-factory/bin/factory ~/.local/bin/factory\n```\n\n`~/.local/bin` must be on your `PATH`. There is no build: a change in the engine reaches every hub immediately.\n\n## 2. The Herdr shortcuts\n\nCopy the contents of the engine's `templates/herdr/config.toml` into your `~/.config/herdr/config.toml` (if you already have one, add its blocks). It brings the sidebar subagent row and the keys `alt+0`…`alt+5`, `alt+e`, `alt+h`, `alt+m` and `ctrl+b` + `a d i r t`. All of them call `~/.local/bin/factory`.\n\n## 3. Check\n\n```sh\nfactory\n```\n\nWith no hub yet, it answers that it can't find one; that already proves it is installed:\n\n```text\nfactory: no hub (no workspace.json above /Users/you; set FACTORY_HUB or ~/.config/factory/hub)\n```\n\nIf you see `command not found`, check the link and your `PATH`. With a hub, `factory` lists the engine commands, the hub's commands and the agents.\n\nNext: create your project's hub.\n"}, {"id": "11-crear-un-hub", "file": "11-crear-un-hub.md", "title": "Create a hub", "md": "# Create a hub\n\nA **hub** is a project's folder for the factory: its repos, its configuration, its context and its specs. There is one engine; hubs, one per project. By the end of this page you will have one with your repos inside.\n\n## 1. Create it\n\n```sh\nfactory hub-init ~/projects/my-hub\n```\n\n```text\nhub my-hub ready in /Users/you/projects/my-hub (OpenSpec store: my-hub)\n```\n\nIt copies the template (each folder has a `README.md` explaining what goes inside), registers the folder as an OpenSpec *store*, links `CLAUDE.md` → `AGENTS.md` and runs `git init`. A second argument changes the store id: `factory hub-init <folder> <store>`.\n\n## 2. Add the repos\n\nEach repo stays where it is, with its own git; the hub only links it:\n\n```sh\ncd ~/projects/my-hub\nln -s ../../code/web web\nln -s ../../code/api api\nprintf 'web\\napi\\n' >> .gitignore\n```\n\n## 3. Tell the factory what each repo is\n\nEdit `AGENTS.md`: its repo table is what the orchestrator reads to decide which repo a task goes to.\n\n```markdown\n| Repo | What it is | Stack | Base branch · branches | Docs |\n|---|---|---|---|---|\n| `web` | The app customers use | Nuxt | `main` · `feat/<slug>` | `web/AGENTS.md` |\n| `api` | API and database | NestJS | `main` · `feat/<slug>` | `api/README.md` |\n```\n\nAnd the \"Where a task goes\" section, in plain sentences: \"screens and copy → `web`; endpoints and data → `api`\".\n\nAnything that helps the agents understand the product goes in `context/`: `product.md`, `architecture.md`, `glossary.md`. You don't need it complete to start.\n\n## 4. Default hub (optional)\n\nHerdr keys run outside any folder, so they use the default hub:\n\n```sh\necho ~/projects/my-hub > ~/.config/factory/hub\n```\n\n## Check\n\nFrom the hub folder, `factory` no longer errors: it lists the commands and the agents.\n\nNext: configure `workspace.json`.\n"}, {"id": "12-configurar", "file": "12-configurar.md", "title": "Configure", "md": "# Configure\n\n`workspace.json`, at the root of the hub, tells the factory how to work on this project. The template already ships with reasonable values; for your first task three things are enough: the repos, the gate and how much you want to approve by hand.\n\n## 1. Repos\n\nOne entry per linked repo, with its role and its base branch:\n\n```json\n\"repos\": {\n  \"web\": { \"roles\": [\"ui\"],  \"base\": \"main\" },\n  \"api\": { \"roles\": [\"api\"], \"base\": \"main\" }\n}\n```\n\n- `roles`: `ui` (what a user sees), `api` (services and data), `infra` (deployment). A monorepo can have several. With `ui`, the task gets a UI spec and an on-screen test.\n- `base`: the branch tasks start from and PRs target.\n\n## 2. Gate\n\nThe gate is the set of checks the code must pass before anyone reviews it. Use the commands you already run in CI:\n\n```json\n\"gate\": {\n  \"repos\": {\n    \"web\": { \"base\": \"main\", \"checks\": [\"pnpm lint\", \"pnpm typecheck\", \"pnpm test\"] },\n    \"api\": { \"base\": \"main\", \"checks\": [\"npm run lint\", \"npm test\"] }\n  }\n}\n```\n\nA repo with no entry has no gate. `protected` and `attention` already come in the template: they warn if a task touches existing tests, migrations or dependencies.\n\n## 3. How much you approve\n\n```json\n\"approvals\": { \"spec\": \"ask\", \"plan\": \"ask\" },\n\"ship\": \"ask\"\n```\n\n- `ask` in `approvals`: the coordinator shows you the spec and the plan and waits for your \"yes\". Leave it like this for your first tasks.\n- `ship`: what it does when finished. `off` creates no PR, `ask` asks you, `draft` or `ready` create it on their own.\n\n## The rest, when you need it\n\n| If you want… | Key |\n|---|---|\n| An isolated branch per task (several tasks at once in the same repo) | `worktrees` and `repos.<repo>.setup` |\n| Dev servers visible and startable from a panel | `servers` |\n| A different model depending on task risk | `routing` |\n| On-screen testing with Playwright | `uiTests`, `uiEnv` |\n| The PR's comments handled automatically | `reviewLoop` |\n| Your own skills or notes for an agent | `agents.<agent>` |\n\nAll of them, with their default value and who reads them: [Configuration reference](31-configuracion.md). A complete example hub: `examples/web-app/workspace.json`.\n\n## Check\n\n```sh\njq '{repos: (.repos | keys), gate: (.gate.repos | keys)}' workspace.json\n```\n\nIt must list your repos in both places; if `jq` errors, the JSON is broken. Run each gate check yourself in its repo, on the base branch: if it already fails there, it will fail on every task.\n\nNext: start the orchestrator.\n"}, {"id": "13-arrancar", "file": "13-arrancar.md", "title": "Start up", "md": "# Start up\n\nThe **orchestrator** is the session that receives your requests and launches one task for each. It lives in Herdr, in a workspace called `hub`, with the hub's panels to its right.\n\n## 1. Open Herdr in the hub\n\nPick one of the two:\n\n```sh\n# a) Inside Herdr, from the hub folder\ncd ~/projects/my-hub\nfactory orchestrator -n orchestrator\n\n# b) With Ghostty: a dedicated window for this hub, with its own Herdr session\nfactory open\n```\n\n`factory open` needs `\"herdr\": {\"session\": \"<name>\"}` in `workspace.json` and starts the orchestrator if it isn't running. With several projects, it is the way to keep them from getting mixed up ([One hub per Herdr session](27-hubs-y-sesiones.md#one-hub-per-herdr-session)).\n\n## If Claude doesn't respond\n\nThe orchestrator starts with the provider that is set (`claude` by default). To continue with Cursor CLI:\n\n```sh\nfactory provider cursor\n```\n\nThen start the orchestrator as above. The one that is already open stays on Claude: exit that session and start it again. In the pane you will see `orchestrator: cursor` and the process is `cursor-agent`. New tasks also run on Cursor. To go back, once Claude responds: `factory provider claude` and restart the orchestrator. The details are in [provider](27-hubs-y-sesiones.md#provider-claude-or-cursor).\n\n## 2. What it does on startup\n\n- Renames its workspace to `hub`.\n- Opens the `panels.hub` panels to its right (the template ships `agentes`, `tareas` and `prs`).\n- Launches the watchers `pr-watch` (your PRs: comments, conflicts, CI, merge) and `sys-watch` (Claude usage and notices), one instance of each.\n- Picks up the tasks that were waiting in `.board/inbox/`.\n\n## Check\n\n- The workspace is called `hub` and on the right you see the `agentes` panel with the orchestrator.\n- `alt+h` opens the shortcut cheat sheet.\n- `factory usage` shows your Claude usage for the 5 h and 7 day windows.\n\nIf the panel doesn't appear, from the orchestrator pane: `factory hub-panel --replace`.\n\nNext: your first task.\n"}, {"id": "14-primera-tarea", "file": "14-primera-tarea.md", "title": "Your first task", "md": "# Your first task\n\nA task goes from a request in your own words to a reviewed and tested PR. For the first one, pick something small that you can check by eye: a text, a new field, a bug with clear steps.\n\n## 1. Ask for it\n\nFrom any terminal:\n\n```sh\nfactory task \"On the profile screen, the Save button doesn't disable while the form is being submitted and can be clicked twice. Disable it until the API responds.\"\n```\n\nOr write it in the orchestrator's chat. Say **what** and **why**; the task decides how. If you know the repo, add it at the end as a hint (`factory task \"…\" web`).\n\n## 2. The orchestrator launches it\n\nIt decides the repos and the branch, and runs `factory task-start`. A **new Herdr workspace** appears with the task's name: inside, its **coordinator** on the left and the task panel on the right.\n\n## 3. Approve the spec\n\nThe **specker** reads the code and writes the spec: what changes, how it is checked and the **risk** (`tiny`, `low`, `medium`, `high`). The coordinator shows you a summary with decisions and questions in its pane.\n\nAnswer there: \"yes\", or whatever you want changed. With `approvals.spec: ask` it doesn't continue without you.\n\n## 4. Approve the plan\n\nThe coordinator sends **scouts** to look at the code and writes the plan per repo, with each repo's rules. It shows it to you and waits for your \"yes\" (`approvals.plan: ask`).\n\n## 5. Watch it being built\n\nYou don't have to do anything. In the task panel:\n\n- **agentes**: the subagents in order. **Workers** that implement, the **gate** (your checks), the **reviewer** that reads the diff, the **testers** that run the e2e tests and, if there is a screen, the ui-tester with its screenshots.\n- **cambios**: the diff per repo. `ctrl-n` jots a note on a line and `ctrl-s` sends them to the coordinator as adjustments from you.\n\nIf something doesn't pass, it goes back to the same worker. At most 3 rounds.\n\n## 6. Result and PR\n\nWhen finished, the coordinator writes `result.md` next to the spec: status (`VERIFIED`, `FAILING` or `BLOCKED`), what changed, what needs your attention and the manual QA that remains. With `ship: ask` it asks you whether to create the PR; with `draft` or `ready`, it creates it on its own.\n\n## 7. After the PR\n\n`pr-watch` watches the PR every 2 minutes. Review comments, a conflict with the base or red CI go back to the coordinator, which handles them. When the PR is merged, the task closes itself (`factory task-end`) and its workspace is closed.\n\n## If something goes wrong\n\n| You see | Do |\n|---|---|\n| The task's workspace doesn't appear | Check the orchestrator's chat; `factory task --list` shows what is waiting in the inbox |\n| `GATE FAIL` on every round | Run the check by hand on the base branch: if it fails there, fix it first or remove it from `gate` |\n| `BLOCKED` | The coordinator says what is missing (a server, docker, data). Fix it and tell it in its pane |\n| You want to stop it | Tell the coordinator; to discard it: `factory task-end <task> --discard` |\n\nWhat happens inside, phase by phase: [Task lifecycle](21-ciclo-de-una-tarea.md).\n\nNext: day to day.\n"}, {"id": "15-dia-a-dia", "file": "15-dia-a-dia.md", "title": "Day to day", "md": "# Day to day\n\nWith the hub up and running, this is what you will use every day: how tasks come in, how to follow them, the panels and the shortcuts.\n\n## Handing over a task\n\n- **In its chat**: a `<ticket>` ticket, a link or your own words.\n- **From any terminal, script or other agent**: `factory task \"<what and why>\" [repo…]` (the repos are a hint; the orchestrator decides), or `factory task -f tasks.md` with several separated by a `---` line. Each one is left as a file in `<hub>/.board/inbox/`; if that hub's orchestrator is running it is notified immediately, and if not, it picks them up on startup. When it launches one, it moves it to `.board/inbox/done/`.\n- **`tareas` panel**: the inbox (`enter` sends it to the orchestrator, `ctrl-x` discards it, `?` shows it).\n- **With a task manager** (`notion` key): `notion` panel (`factory inbox`), in tabs: current sprint, next, backlog and dates (`1`-`4` or `tab` / `shift-tab` switch tabs while the search box is empty; `ctrl-f` picks the range). `enter` sends the task to the orchestrator.\n\nThe orchestrator decides the repos and branches, leaves the request in `.board/requests/<task>.md` and runs `factory task-start`: a new workspace appears in Herdr with the task's coordinator. What follows is in the [task lifecycle](21-ciclo-de-una-tarea.md).\n\n## Following a task\n\n- The coordinator shows you the spec and the plan **in its pane**, and waits for your \"yes\" if `approvals.spec` / `approvals.plan` is `ask`.\n- **Task panel**, to the right of the coordinator (`factory task-panel`): **agentes** (its subagents in order, with description and duration), **recursos** (the screenshots in `.board/shots/<task>/`, newest on top) and **cambios** (`factory review`: each repo with its branch → base and its commits, the touched files with `+/-`, ● = uncommitted, and the diff with delta; `enter` opens the diff in Neovim, `ctrl-e` edits, `ctrl-l` lazygit; `ctrl-n` jots a note on the file and line, `ctrl-o` edits the notes and `ctrl-s` sends them all together to the coordinator, which treats them as adjustments from you). For a coordinator launched earlier: `factory task-panel <pane> <.tasks/<task> folder>`.\n- When it finishes, `result.md` is left next to the spec; with `ship` other than `off`, so are the PRs.\n- Once the PR is merged, the coordinator closes the task on its own (`factory task-end`, notified by `pr-watch`).\n\n## Period changelog\n\nAsk the orchestrator for it (\"make this week's changelog\") or run `factory changelog [period]` (`since 2026-11-01`, `last week`): it opens a session in its own Herdr workspace `changelog` that reads the tasks closed since the last changelog (those archived in `openspec/changes/archive/` and `briefs/archive/` with the PR merged) and writes a page for people who use the product: **New**, **Improvements** and **Fixes**, grouping the tasks that make up a single feature, with no ticket ids or component names. It shows you the draft and proposes the videos; nothing is recorded without your \"yes\".\n\nEach video comes out in two steps:\n\n1. **Recording**: a `ui-tester` in `demo` mode uses the new feature in the `uiEnv` environment, from the main checkout of the `ui` repo on its base branch (login off camera, visible cursor). It saves the raw take and a timeline with where and when each step happens (`events.json`).\n2. **Editing**: a `video-editor` assembles it with [Hyperframes](https://hyperframes.heygen.com): it starts right at the change (no navigation or loading beforehand), the recording sits in a frame with the waits cut out, with zoom and focus on each click and a caption per step, and ends on the result. An intro or outro card only if the hub's `GUIDE.md` asks for them. It checks frames before rendering and leaves the project so you can fine-tune it.\n\nEverything ends up in `changelogs/<date>/`: `index.html` (the page, with the hub's design), `CHANGELOG.md` (to paste into your docs tool or Slack) and `videos/<feature>.{mp4,gif,jpg}` with its Hyperframes project. Publishing it is your decision.\n\n**Hub configuration**, in `changelogs/` (all optional; with nothing, the engine's defaults are used):\n\n- `GUIDE.md`: product, audience, language and tone, what counts as internal, how many videos and about what, format and branding. For example:\n\n  ```markdown\n  Product: My App · Audience: product, sales and support team · Language: English, second person, no jargon\n  Internal: infrastructure, telemetry, refactors and tests; one line at the end at most\n  Videos: up to 3, only features that the end user or moderator sees; landscape format; soft music yes, voice no; no intro or outro card\n  Brand: background #0f0f14, accent #ff7a1a, typeface Space Grotesk, logo assets/logo.svg\n  ```\n- `template.html`: the page's design. Start from the engine's (`templates/changelog.html`) and respect its contract, described in the comment at the top: `{{…}}` fields, `data-repeat`, `data-section` and `data-if` blocks. Everything else (styles, header, footer) is yours.\n- `assets/`: logo, fonts and music named by the guide and the template; they are copied next to each page.\n\n## Hub panel\n\nTo the right of the orchestrator, the panels from `workspace.json` → `panels.hub`, stacked (each one is `panels/<name>.sh` via `factory panel`):\n\n| Panel | What it shows |\n|---|---|\n| `agentes` | `factory board`: orchestrator, one coordinator per task and their subagents |\n| `tareas` | The `.board/inbox/` inbox |\n| `notion` | Your tasks from the task manager (only with the `notion` key) |\n| `prs` | `factory prs`: your open PRs, `enter` opens, `?` checks |\n| `servidores` | `factory servers`: the dev servers from `servers`; each one runs in an `srv:<name>` pane of the `servidores` tab |\n\nIt opens when the orchestrator starts if its tab has no other panes. To rebuild it: `factory hub-panel --replace` from the orchestrator pane (an open panel carries its command baked in, so this is also the way to pick up an engine change).\n\n## Shortcuts\n\nNo prefix, in any workspace (`factory goto` resolves them by the pane's label, not by its position):\n\n| Key | Goes to |\n|---|---|\n| `alt+1` | Main session (orchestrator or coordinator) |\n| `alt+2` | agentes |\n| `alt+3` | notion (hub) · cambios (task) |\n| `alt+4` | prs |\n| `alt+5` | servidores |\n| `alt+0` | The hub's orchestrator |\n| `alt+m` | Minimize / restore the focused pane (`factory fold`) |\n| `alt+e` | Neovim in the repo you are in (`factory edit`; in a task with several repos it asks which) |\n| `alt+h` | Cheat sheet with all the shortcuts (`factory keys`) |\n\nWith the `ctrl+b` prefix: `w` workspaces, `t` board, `i` task-manager tasks, `r` PRs, `d` lazygit, `a` orchestrator, `h j k l` move around, `?` Herdr help. The keys live in Herdr's config (`~/.config/herdr/config.toml`) and call `factory <command>`, so they run on the default hub unless the pane is inside another hub.\n"}, {"id": "20-arquitectura", "file": "20-arquitectura.md", "title": "Architecture", "md": "# Architecture\n\n## Layers\n\n```mermaid\nflowchart TB\n  U[User] -->|chat · factory task · panel| O[Orchestrator<br/>workspace hub]\n  O -->|factory task-start| C1[Coordinator task A]\n  O -->|factory task-start| C2[Coordinator task B]\n  O -->|factory jared| J[Jared]\n  O -->|factory audit-start| A[Auditor]\n  C1 --> S[specker · scout · ui-designer<br/>worker · reviewer · tester · ui-tester]\n  C1 -->|factory gate| G[Repo checks]\n  C1 -->|ship| GH[(GitHub PR)]\n  PW[factory pr-watch] -->|PR opened / merged| O\n  PW -->|comments, conflicts, red CI| C1\n  O -.->|Status, if there is a task manager| N[(Task manager)]\n  J -.->|create tasks| N\n```\n\n| Layer | What it is | Where |\n|---|---|---|\n| **Engine** | This repo (`code-factory`): kit, scripts, panels, OpenSpec schema, hub template. Shared by all hubs; it knows nothing about any project. | `kit/`, `bin/`, `panels/`, `openspec/schemas/factory`, `templates/hub/` |\n| **Hub** | A project's folder: repo map, config, specs, decisions, testing guides, learnings and task state. | `workspace.json`, `AGENTS.md`, `openspec/`, `briefs/`, `testing/`, `learnings/`, `.board/`, `.tasks/` |\n| **Repos** | The product repos, linked inside the hub, each with its own git and its own rules (`AGENTS.md`). Each one has **roles** in `workspace.json`: `ui`, `api`, `infra`. | `<hub>/<repo>` |\n| **Kit** | The `factory` Claude Code plugin: agents, skills, hooks, MCP. It is loaded per session with `--plugin-dir <engine>/kit`. | `kit/agents/`, `kit/skills/`, `kit/hooks/`, `kit/mcp/` |\n| **Scripts** | Deterministic Bash/Python for everything that doesn't need a model: preparing branches and worktrees, the gate, watching PRs, panels. You call them with `factory <command>`. | `bin/`, `panels/`; the hub's own in `<hub>/bin/` |\n| **Herdr** | Terminal multiplexer: one *workspace* per main session, with side panels. Agents talk to each other with `herdr agent prompt`. | skill `factory:herdr` |\n\n**Golden rule:** each repo rules itself (stack, commands, branches, tests). The hub doesn't duplicate that; if it contradicts the repo, the repo wins. And the engine doesn't name a project's repos, branches or services: it reasons by role (`the repo with role ui`) and by config key (`repos.<repo>.base`).\n\n## Main sessions and subagents\n\nA **main session** is a `claude` process with its own Herdr workspace; a **subagent** lives inside a session and returns a report to it.\n\n| Session | Agent | Model | Launched by |\n|---|---|---|---|\n| Orchestrator | `factory:orchestrator` | Sonnet | `factory orchestrator` (= `factory claude-kit orchestrator`) |\n| Coordinator (one per task) | `factory:coordinator` | Opus | `factory task-start` |\n| Senior coordinator (in its place, structural UI work) | `factory:senior` | Fable | `factory task-start --senior` |\n| Jared | `factory:jared` | Sonnet | `factory jared` |\n| Auditor | `factory:auditor` | Sonnet | `factory audit-start` |\n| Changelog | `factory:changelog` | Sonnet | `factory changelog [period]`, or ask the orchestrator |\n\nThe senior is a coordinator with the same flow and team, for redesigns, migrations to a component library or a design system: it writes the `design-plan.md` itself (tokens, components by layer, order by batch) and the foundations (theme and a reference component), and hands out the rest to workers, one batch each. Fable has its own quota, so it doesn't spend the Claude window or jump to Cursor at 95%.\n\nThe coordinator is the only session on Opus: it decides, it doesn't execute. The expensive work (reading code, editing, testing) is done by cheaper subagents; the worker's and reviewer's model comes from the task's risk (`routing`, [Spec and plan](23-spec-y-plan.md#risk-and-routing)). Details of each one in the [agent reference](32-agentes.md).\n\nAll of them start with `--settings \"$(bin/lib/kit-settings)\"`, which passes them `FACTORY_HUB` and `FACTORY_HOME` and gives access to the engine ([Hubs, sessions and extensions](27-hubs-y-sesiones.md#kit-sessions)). The coordinator also gets `--add-dir` for the hub and for the real path of each repo in the task.\n\n**When a kit change is picked up:** when the session starts. A running coordinator keeps the kit it started with; `factory task-start` always loads the current one. The config each task ran with is stored in `.board/tasks/<task>.json`.\n\n## Context and cost\n\nRules shared by all main sessions (the **Context** block of their prompts):\n- At most `claude.parallel` subagents at a time (2 by default).\n- A request carries paths, line ranges and the question; never the body of a file or a diff.\n- What comes back fits in a few dozen lines with `path:line`; if it's more, the subagent writes it to a file and returns the path (e.g. each round's reports in `rounds/<N>/`).\n- A worker is reused per repo (you send it only the delta) for up to 2 fix rounds or ~60k tokens of context; reviewer, tester and ui-tester are always new, so they read without bias.\n\n`factory ctx [N | <task>]` measures, from the transcripts, the context of each agent in the latest tasks: baseline, peak, turns, compactions and which tools filled it.\n\n## Where each piece of state lives\n\nPaths are relative to the hub.\n\n| Path | Contents | Written by | Read by |\n|---|---|---|---|\n| `.board/inbox/<date>-<slug>.md` | Tasks waiting to be launched (`factory task`, panel `tareas`); once launched → `done/` | `factory task`, orchestrator | orchestrator |\n| `.board/requests/<task>.md` | The request as the orchestrator left it | orchestrator | specker |\n| `openspec/changes/<task>/` | Full task: `proposal.md`, `specs/`, `tasks.md`, `ui.md`, `result.md`, `rounds/<N>/` | specker, coordinator, reviewer, ui-designer | everyone |\n| `briefs/<task>/` | Light task: `brief.md`, `ui.md`, `result.md`, `rounds/<N>/` | same | everyone |\n| `openspec/specs/` | Current requirements (they grow on archive) | `factory task-end` | specker |\n| `.tasks/<task>/<repo>` | Each repo's working folder: link to the main checkout or worktree | `factory task-start`, `factory task-move` | coordinator and team |\n| `.board/tasks/<task>.json` | Config the task ran with and its Herdr workspace | `factory task-start` | `factory task-end` |\n| `.board/setup/<task>-<repo>.log` | Output of the worktree `setup` | `factory task-start` | coordinator |\n| `.board/gate/<task>/<repo>.{log,txt}` | Full output and summary of the gate | `factory gate` | worker (the log), coordinator (the summary) |\n| `.board/shots/<task>/` | Screenshots, crops and `evidence.json` from the on-screen test | ui-tester | user, ui-designer, panel `recursos` |\n| `.board/<session_id>` | Subagents of each Claude session (for the board). Cursor ones are read from its transcript, because the hook doesn't run there | hook `subagents.sh` | `factory board` |\n| `.board/kit-settings.json` | Settings of this hub's kit sessions | `bin/lib/kit-settings` | `claude` |\n| `.board/pr-watch.log`, `.board/sys-watch.log` | What the watchers did | `pr-watch`, `sys-watch` | user |\n| `learnings/<repo>.md`, `learnings/workflow.md` | Pitfalls and recipes with date and task | retro (with your \"yes\") | coordinator, specker, ui-designer |\n| `testing/<repo>/**/TESTING.md` | Testing guides: environments, users by role, data | retro, by hand | tester, ui-tester, coordinator |\n| `audits/<repo>/<date>-<types>/` | Audit reports | auditor | user |\n| `changelogs/<date>/` | The period's `index.html` and `CHANGELOG.md`, `videos/` (mp4, gif, poster and Hyperframes project for each item; raw takes in `raw/`) | changelog, ui-tester (`demo`), video-editor | user |\n| `changelogs/GUIDE.md`, `template.html`, `assets/` | What the hub's changelog looks like: audience, tone, brand, videos and page design | user | changelog, video-editor |\n"}, {"id": "21-ciclo-de-una-tarea", "file": "21-ciclo-de-una-tarea.md", "title": "Task lifecycle", "md": "# Task lifecycle\n\n```mermaid\nflowchart TD\n  R[Request<br/>chat · factory task · task manager] --> TS[task-start<br/>branches · worktrees · setup]\n  TS --> SP[Spec<br/>specker]\n  SP -->|approvals.spec| PL[Plan + scouts<br/>+ UI spec · routing by risk]\n  PL -->|approvals.plan| W[Workers<br/>one per repo]\n  W --> GT{gate}\n  GT -->|GATE FAIL| W\n  GT -->|GATE PASS| RT[Reviewer + e2e suites + on-screen test]\n  RT --> CR[ui-designer critique]\n  CR -->|CHANGES NEEDED, max. 3 rounds| W\n  CR -->|all OK| RES[result.md]\n  RES -->|ship| PRx[PR]\n  PRx --> PW{pr-watch}\n  PW -->|comments| RL[review-loop]\n  PW -->|conflict| RC[resolve-conflicts]\n  PW -->|red CI| W\n  RL --> PRx\n  RC --> PRx\n  PW -->|merged| END[task-end]\n```\n\n## 1. Request and start · orchestrator\n\n1. It reads the request: from the chat, from a file in `.board/inbox/` (`factory task`) or, with a task manager, from the ticket (`factory notion-page <ticket>`). It decides which repos are involved using the map in the hub's `AGENTS.md`. It sends a scout only if it doesn't know.\n2. It names the task `<ticket>-<slug>` (or a 2-4 word slug if there is no ticket) and picks the branch and base per repo, from the table in `AGENTS.md` and `repos.<repo>.base`.\n3. It writes `.board/requests/<task>.md` and launches, without asking:\n   ```sh\n   factory task-start <task> <repo>:<branch>:<base> [...]\n   ```\n   With `--senior` before `<task>` it starts the senior coordinator ([architecture](20-arquitectura.md)): for a UI redesign or migration; the request names the design source and the target.\n   If it came from the inbox, it moves the file to `.board/inbox/done/`.\n4. With a task manager, it moves the ticket to `notion.status.started`.\n\n`factory task-start` (a lock keeps two starts from stepping on each other; it refuses if the task already has a workspace):\n- Per repo it decides **main checkout or worktree** ([Repos, worktrees and environments](22-repos-worktrees-entornos.md)). In a worktree it copies the ignored `.env*` files from the main checkout (without opening them) and runs `repos.<repo>.setup` if there is one; with `repos.<repo>.taskServers`, it calls the hub's `task-servers` to give it its servers.\n- It saves the config in `.board/tasks/<task>.json` (including `provider`: claude or cursor), opens a Herdr workspace with the detail panel and starts the coordinator with a short first message: `Task … Repos here: web (ui) api (api). Plan approval … Ship … UI tests … UI before … UI env …`. The roles come from `repos.<repo>.roles`; the coordinator plans by role. With the provider set to Claude and a usage window at 95% or more, that coordinator starts on Cursor; the orchestrator stays on Claude ([provider](27-hubs-y-sesiones.md#provider-claude-or-cursor)).\n\n## 2. Spec · specker\n\nWith no prior spec, the coordinator calls the specker, which chooses **full** (an OpenSpec change) or **light** (`briefs/<task>/brief.md`), reads the code it needs and returns a summary with decisions, **risk** and questions. With `approvals.spec: ask` it waits for your \"yes\"; with `auto` it carries on with the defaults. Details in [Spec and plan](23-spec-y-plan.md).\n\n## 3. Plan · coordinator\n\n1. It reads the spec, each repo's `AGENTS.md` and `learnings/`. Using the spec's **Risk** section it picks the `routing` row: worker model, reviewer model and effort and, if the row says so, plan approval.\n2. It launches scouts (Haiku) with concrete questions: which files, how something similar is done, which tests cover it.\n3. If the task changes what a user sees in a `ui` repo, it launches the **ui-designer in `plan` mode** at the same time; its answer is saved as `ui.md` next to the spec.\n4. It writes the per-repo plan (with a **Rules** line: the repo rules that apply) and, with `uiTests: on` and code in a `ui` repo touched, the **on-screen test plan**: environment, numbered flows, screenshots, data.\n5. `approvals.plan: ask` → it waits for your \"yes\"; `auto` → it carries on and leaves doubts as \"Decision: …\".\n\n## 4. Early warning · `ui-preflight`\n\nOnly for tasks with a screen (skill `ui-test`). While the workers start, if the hub has `factory ui-preflight`, the coordinator runs it itself (seconds, no agent) and asks you at once for whatever only you can do (start docker, switch the backend, create data). Nobody waits for it.\n\n## 5. Implement · workers\n\nOne worker per repo, in parallel up to `claude.parallel`, because the contract is already fixed in the spec. Each worker reads the repo's rules, builds exactly its part of the plan (and `ui.md` if there is one) and verifies with the tests for what it touches.\n\n## 6. Gate\n\nBefore any reviewer or tester, the coordinator runs `factory gate <task>`: types, lint and unit tests for what was touched, using the commands in the hub's `gate.repos.<repo>.checks` (never from the branch). No tokens. `GATE FAIL` → the `✗` lines and the log path go to the worker, and the gate runs again; after 3 retries, `FAILING`. Details in [Quality](24-calidad.md#gate).\n\n## 7. Review and test\n\nIn parallel, within the same limit:\n- **reviewer**: diff against the plan, bugs, forgotten calls, repo rules, both sides of the contract, and each `protected:` / `silenced:` from the gate.\n- **tester**: only the repo's e2e tests for what was touched (the gate already passed types, lint and unit tests); none if the diff doesn't touch code that runs. If it shares the task's fronts with the ui-tester, they run one after the other, never at the same time.\n- **ui-tester `ui`** (tasks with a screen): brings up what the flows need (preflight, services, data, users), runs them with Playwright and takes the screenshots. A `BLOCKED` is asked to you once; if it persists, the flows move to \"manual QA\".\n- **ui-designer `critique`**: after `ui` (or after a ui-tester `capture` if there is no on-screen test), it judges screenshots, crops and measurements against `ui.md`.\n\nEach review writes its report in `rounds/<N>/` next to the spec (`review.md`, `critique.md`) and returns only the verdict.\n\n## 8. Fix loop\n\n- The task is ready only with reviewer `APPROVE`, all testers `OK` and, with `ui.md`, critique `APPROVE`.\n- Blocking findings go **to the same worker** of the repo: the path of the round file and the numbers of its findings. Optional ones go to \"Pending\".\n- Each round: gate, a new reviewer on the delta, suites narrowed to what changed, `ui` if front code was touched and a new critique if the previous one blocked.\n- **Maximum 3 rounds.** If it isn't ready: `Status: FAILING` and it stops.\n- A new worker replaces the previous one when the reviewer rejects the approach, the change is in a different area, it has already done 2 rounds or its context exceeds ~60k tokens.\n\n## 9. Result and delivery\n\n1. `result.md`, in English: status, rounds, **⚠ Needs attention** (high risk, `attention:` lines from the gate, accepted `protected:`/`silenced:`, default decisions), changes per repo, on-screen test, manual QA and pending items.\n2. **Ship** according to `ship`: commit only the task's files, push and one PR per repo (`api` first), with the screenshots.\n3. **Cleanup** (tasks with a screen): the coordinator stops the services the ui-tester left running in the servers panel.\n4. **Retro**: it proposes learnings and writes them only with your \"yes\".\n\n## 10. PR life\n\n`factory pr-watch` (every 2 min, `gh` only) notifies:\n- the **orchestrator**: PR open in all repos → task manager to `status.pr`; all merged → `status.merged` (and `factory task-end` if the coordinator is gone).\n- the **coordinator**: all merged → it closes the task with `factory task-end`, which also closes its workspace.\n- the **coordinator**: new review comments → skill `review-loop`; conflict with the base → `resolve-conflicts`; red CI → if it's the code's fault, one fix round; if not (flaky, infra), it tells you.\n\nDetails in [Delivery and follow-up](25-entrega.md).\n\n## Adjustments you ask for midway\n\nAt any time you can ask for changes (text or screenshots) in the coordinator's pane. Each one is a mini-loop: scout if needed → the repo's worker → one full fix round (gate → reviewer on the delta → tester) → noted under \"Adjustments\" in `result.md` → if there was already a PR, push to the same branch.\n\n## Final statuses\n\n| Status | Meaning |\n|---|---|\n| `VERIFIED` | Gate, reviewer, testers and critique all green |\n| `FAILING` | 3 rounds (or 3 gate retries) without success; the report says what fails |\n| `BLOCKED` | Something is missing that the team can't start (e.g. the on-screen test couldn't run); it isn't shipped without your \"yes\" |\n"}, {"id": "22-repos-worktrees-entornos", "file": "22-repos-worktrees-entornos.md", "title": "Repos, worktrees and environments", "md": "# Repos, worktrees and environments\n\n## The hub's repos\n\nEach repo lives inside the hub as a link to its checkout (`ln -s ../<repo> <repo>`) and is declared in `workspace.json` → `repos`:\n\n```json\n\"repos\": {\n  \"web\": { \"roles\": [\"ui\"], \"base\": \"main\", \"setup\": \"cp \\\"$SRC/.env\\\" . && pnpm install --frozen-lockfile\" },\n  \"api\": { \"roles\": [\"api\"], \"base\": \"develop\", \"worktrees\": true }\n}\n```\n\n| Key | What it's for |\n|---|---|\n| `roles` | `ui` (what a user sees), `api` (services and data), `infra` (deployment, cloud). A monorepo can have several (`[\"ui\", \"api\"]`). With `ui` there is a UI spec, an on-screen test and a design critique. |\n| `base` | Branch that tasks start from and that PRs target |\n| `worktrees` | Overrides the global `worktrees` for this repo |\n| `setup` | Command that prepares each new worktree (see below) |\n| `taskServers` | `true` if its servers run per task in each worktree, using the hub's `task-servers` command |\n\nThe repo's key is its path relative to the hub (`web`, `group/other-repo`). The orchestrator also uses the repo table in the hub's `AGENTS.md` to know what each one is and how branches are named.\n\n## Main checkout or worktree\n\nEach task has `.tasks/<task>/<repo>`, which is one of two things:\n\n| Form | What it is | What it's for |\n|---|---|---|\n| **Link** to the main checkout | The task's branch is checked out in your own checkout | Your local server sees the agent's changes immediately; you can edit code by hand |\n| Git **worktree** | A separate checkout in `.tasks/<task>/<repo>` | Parallel tasks without stepping on each other or on you |\n\n`factory task-start` decides using `worktrees` in `workspace.json` (or `repos.<repo>.worktrees`):\n\n| Value | Behavior |\n|---|---|\n| `false` (default) | Main checkout. If it's busy, worktree. |\n| `\"on-demand\"` | Like `false`, but it also counts as busy if you're on a branch that is neither the base nor the task's, even if everything is committed. Your work in progress never changes branch. |\n| `true` | Always a worktree. |\n\n\"Busy\" = another task linked to the same repo, uncommitted changes, or (on-demand) your branch. When it falls back to a worktree, `task-start` says so: `note: <repo> is on your branch … → worktree; when it is free: factory task-move <task>`.\n\n- **`factory task-move <task>`** moves a task from a worktree to the main checkout so you can test it with your servers. It uses the same \"busy\" rule and the same lock as `task-start` (they share `bin/lib/checkout.sh`), so it never takes your checkout off your branch. Uncommitted work travels in a stash identified by its id: if a step fails, the work goes back to the worktree or the message says which stash holds it. Run it with the task's agents idle.\n- **`factory task-end <task>`** removes worktrees (git refuses if there are uncommitted changes) or links (the branch stays active in your checkout).\n\nIn the main checkout, agents never revert, stash or reset files they haven't touched, and the commit includes only the files the workers said they changed.\n\n## Preparing a worktree: `setup`\n\nA new worktree doesn't have what git ignores. `task-start`:\n1. Copies the ignored `.env*` files from the root of the main checkout, without opening them.\n2. If the repo has `repos.<repo>.setup`, runs it in the worktree with `SRC` = the main checkout, **before** starting the coordinator (its workers and the gate need it ready). Use it to install dependencies or copy local files from subfolders. Output goes to `.board/setup/<task>-<repo>.log`; if it fails, `task-start` warns and the coordinator will see it.\n\n## Per-task servers: `taskServers`\n\nA repo with `repos.<repo>.taskServers: true` starts its servers inside each worktree, without colliding with yours. The engine doesn't know how: the hub's `task-servers` command (`<hub>/bin/task-servers`) does it, called by `task-start` (`seed`, `setup`, `env demo`), `task-move`, `task-end`, `sys-watch` and the tester (`start`, `stop`, `status`). The skill `factory:worktrees` explains to the agents how to use it.\n\nWhoever starts servers stops them before reporting (the ui-tester, on every run). `task-end`, `task-move` and `sys-watch` also stop them.\n\n**Example:** a hub can use `task-servers` to give each worktree its own port range, so servers from different tasks don't clash. The `taskServers` number at the root of `workspace.json` limits how many tasks have servers running at once; `start` waits for a free slot and exits with 75 if there isn't one. State and logs go in `.board/servers/<task>.*`. The hub's own skill for `task-servers` explains the details to the agents.\n\n```\nfactory task-servers <task> seed | setup | env [demo] | start <app…> | stop | status\n```\n\n## On-screen test environment: `uiEnv`\n\n| `uiEnv` | What it runs against | Consequences |\n|---|---|---|\n| `demo` (default) | A shared remote environment that the hub defines in its testing guide | No local backend or `api` branch. A flow that needs the task's backend, not yet deployed, moves to \"manual QA\". |\n| `local` | The local stack | Tests `api` and `ui` together, but only the branch checked out in the `api` repo's main checkout (if the stack mounts it). |\n\n- With `demo` and a repo with `taskServers`, `task-start` points the worktree at demo with `task-servers <task> env demo`.\n- The coordinator receives \"UI env: …\" and **never asks** about the environment or asks to edit a `.env`.\n- Test users by role and their credentials are given by the hub's testing guide (`testing/<repo>/`); passwords live outside the hub and no agent prints them.\n\n## Shared backend and database\n\n- **A single local backend.** If the local stack mounts the main checkout of the `api` repo, it runs whichever branch that has. A task in a worktree with `api` changes passes its suites, but its local on-screen test needs `factory task-move`.\n- **A single local DB**, shared by all tasks and by you. Each task creates its own data under its own name and never deletes or changes anyone else's. The kit's `local-db` MCP reads and writes only in that DB (via `docker exec`, without seeing passwords), with no schema changes; it is configured with `localDb` ([Tools](30-herramientas.md#local-db-mcp)).\n- **Docker**, with the common rules in the prompts and, if the hub has it, its `docker` skill:\n  - Allowed without asking: starting Docker Desktop and `docker start` of a stopped container. The `servidores` panel does the same with `docker: true` entries: stopped containers → `docker start`; running but not responding → \"rebuilding or broken\", touching nothing; only if none exists does it offer its `cmd`, to a person and warning that it seeds the DB.\n  - Only with your \"yes\": creating or recreating containers. A recreated container can re-seed the DB and wipe every task's data.\n  - Never: restarting, rebuilding or bringing down (`down`) containers.\n  - With `uiEnv: demo` the ui-tester doesn't touch docker.\n"}, {"id": "23-spec-y-plan", "file": "23-spec-y-plan.md", "title": "Spec and plan", "md": "# Spec and plan\n\n## Spec: the specker\n\nThe specker (Sonnet) writes a task's spec. It doesn't talk to you: the coordinator shows you its summary and forwards your answers back (`SendMessage`) so it updates what it wrote. It writes only in the hub. If the request says something fails (a check, a test, a bug), it first reproduces it on the base branch; if it doesn't happen there (e.g. it only exists in uncommitted files in your checkout), it says so at the very top instead of specifying a fix.\n\n### Full or light?\n\n`workspace.json` `openspec`: `always` → full, `never` → light, `auto` (default) → the specker decides:\n\n| Full (OpenSpec) if **any** | Light if **all** |\n|---|---|\n| More than one repo | One repo |\n| New or changed behavior worth remembering (endpoint, event, contract, business or permission rule, new feature) | Bug, copy/i18n, styles, config, small refactor, dependency bump, tweak |\n| Large (≈5 SP or more, many files) | No contract change |\n| Ambiguous requirements that need decisions in writing | The scope fits in 1-3 sentences |\n\nWhen in doubt, full.\n\n| | Full | Light |\n|---|---|---|\n| Where | `openspec/changes/<task>/` | `briefs/<task>/brief.md` |\n| Files | `proposal.md` (Why, Ticket, Repos table, Contract, Decisions, Risk), `specs/<capability>/spec.md` (requirements with scenarios), `tasks.md` (one group per repo) | Why, What, Repos, Decisions, Risk, Done when, Manual QA |\n| Validation | `openspec validate <task> --store <store>` | — |\n| On close | Archived and its requirements move to `openspec/specs/` | Moved to `briefs/archive/` |\n\nEach hub is its own OpenSpec *store*: its id is in `<hub>/.openspec-store/store.yaml` (created by `factory hub-init`); `task-start` passes it in the coordinator's first message, which passes it to the specker. The schema is `factory` (`openspec/schemas/factory`, copied into the hub). Each hub's rules go in its `openspec/config.yaml`; the template's: prose in English, never commit/push/PR or manual QA tasks in `tasks.md` (manual QA goes in the proposal and from there to `result.md` and to the PR's \"How to test\").\n\n### What it reads before writing\n\nThe hub's `AGENTS.md` (repos, branches), `context/`, `learnings/<repo>.md` and `learnings/workflow.md`, each repo's `AGENTS.md` and the repo guides that affect the change. From the code, only what it needs to be concrete: real endpoints, permissions, events and routes. It doesn't invent a name it hasn't read; if it couldn't confirm one, it says so.\n\n### Risk and routing\n\nEvery spec has a **Risk** section: `- Risk: <level> — <reason>` and `- Surfaces: <list>`. It measures what the change can break, not its size:\n\n| Level | When |\n|---|---|\n| `high` | Payments, prices, subscriptions or webhooks; auth, roles, permissions or who sees what data; a migration that changes or loses data; breaking a contract other repos depend on; deploy, CI or infra |\n| `medium` | New behavior: a new endpoint, event, business rule, screen or flow; an additive migration |\n| `low` | A local bug, a small refactor, a tweak, config with some logic |\n| `tiny` | A mechanical change with no logic: texts, a style token, a constant, a rename in one place |\n\nSurfaces: `ui` (changes what a user sees in a `ui` repo) and `security` (auth, permissions, payments, webhooks, secrets, user input that reaches a query, a shell or HTML). A surface doesn't raise the level: it adds a lens for the reviewer.\n\nThe coordinator reads the level and takes that row of `workspace.json` → `routing`: worker model (`worker`), reviewer model and effort (`reviewer`, `reviewerEffort`) and, if the row says so, `planApproval`, which overrides `approvals.plan`. With no Risk section, `medium`. It tells you in one line (`Risk high · ui, security → worker opus, reviewer opus/high, plan: ask`). If it thinks the level is wrong, it uses another and says why. On `tiny`, if its cheap worker fails the gate or the review, the fix goes to a new worker with the `low` model.\n\n### Answer and approval\n\nIt returns: full or light and why, the risk with its reason, the path, the summary (what changes per repo, contract, scenarios), the decisions made and numbered **Questions**, each with its default. Each default is written into the spec as \"Decision (default, unconfirmed): …\", so the result and the PR show what was assumed.\n\n| `approvals.spec` | What the coordinator does |\n|---|---|\n| `ask` | Waits for your \"yes\"; your answers go to the same specker |\n| `auto` | Carries on with the defaults, except for a product decision with no reasonable default |\n\nIf, while planning a light task, it turns out not to be one (it changes a contract, it's much bigger), the coordinator stops, tells you, and with your \"yes\" the specker turns it into a full one.\n\n\"Spec only\": if you ask the orchestrator for it, it calls the specker itself without starting the task; `task-start` later picks up the change or brief already written.\n\n## Plan: the coordinator\n\nThe plan is written in the coordinator's pane, per repo: files, changes, the shared contract, how to verify and a **Rules** line with the repo guides that apply (passed to the worker and the reviewer). It is fed by:\n- **Scouts** (Haiku), at most `claude.parallel` at a time, with concrete questions.\n- **ui-designer `plan`**, if the surface includes `ui` → `ui.md` next to the spec ([Quality: gate, review, tests and design](24-calidad.md#ui-designer)).\n- **On-screen test plan**, with `uiTests: on` and code in a `ui` repo touched: environment (`uiEnv`), numbered flows (role, URL, steps, expected result), screenshots (screen, app, route, user, state, widths and measurements from `ui.md`) and realistic data, because they end up in the PR. It is written after reading the `testing/<ui repo>/**/TESTING.md` guides. A task without a `ui` repo has none: its endpoints are covered by the suites and screen checks go to \"manual QA\".\n\n| `approvals.plan` (or `planApproval` from the routing row) | What the coordinator does |\n|---|---|\n| `ask` | Waits for your \"yes\" in its pane |\n| `auto` | Starts implementing; doubts are left as \"Decision: …\" and it stops only for what the team can't do without you (credentials, human actions, data it can't find) |\n\nIf the plan changes scope or contract, it updates `proposal.md` / `tasks.md` and validates. During the task it ticks `tasks.md` (`- [x]`) after each verified step.\n\n## `result.md`\n\nThe coordinator writes it when done, in English, next to the spec:\n\n```md\n# <task> · result\n- Status: VERIFIED | FAILING | BLOCKED\n- Rounds: n (reports in `rounds/`)\n## ⚠ Needs attention    high risk, attention:/protected:/silenced: from the gate, default decisions; or \"Nothing\"\n## Per repo             changes, verification (commands and result), PR\n## Adjustments          what you asked for during the task\n## On-screen test       environment, flows ✅/❌ with their screenshot, diffs, link to the PR comment\n## Manual QA            steps to test by hand (they go to the PR's \"How to test\")\n## Pending              what's missing, what wasn't tested, decisions for you\n```\n\nThe orchestrator summarizes it when it appears, and the review-loop adds \"PR review\".\n"}, {"id": "24-calidad", "file": "24-calidad.md", "title": "Quality: gate, review, tests and design", "md": "# Quality: gate, review, tests and design\n\nFive independent checks; none of them is done by whoever wrote the code:\n\n| Check | Who | Model | Blocks if |\n|---|---|---|---|\n| Gate | `factory gate` (script) | — | A repo check fails (types, lint, unit tests) |\n| Code review | reviewer | per `routing` (Sonnet/Opus, medium/high effort) | Bug, broken repo rule, missing spec scenario, out-of-scope changes, unjustified `protected:`/`silenced:` |\n| Repo suites | tester `suites` | Sonnet | An e2e test fails (after one retry) |\n| On-screen test | ui-tester `ui` | Sonnet | A flow fails |\n| Design | ui-designer `plan` / `critique` | Sonnet (effort high) | UI spec not followed, missing state, broken layout, accessibility failure, hard-to-find action |\n\n## Gate\n\n`factory gate <task> [repo…]` runs after the workers and before any reviewer or tester. Minutes, no tokens.\n\n- **Checks** come from `workspace.json` → `gate.repos.<repo>.checks`, with `{base}` → `origin/<base>` (`gate.repos.<repo>.base`). They come from the hub, never from the branch: a worker cannot change what it is judged by. Typically types, lint and unit tests for the packages touched.\n- **`protected:`**: existing files that match `gate.protected` (tests, lint/type/test configs) and that the branch modified or deleted.\n- **`silenced:`**: added lines that silence a check (`eslint-disable`, `@ts-ignore`, `.skip`/`.only`).\n- **`attention:`**: files that match `gate.attention.<label>` (migrations, `package.json`, CI/deploy, env). They don't judge anything: they go to \"⚠ Needs attention\" in `result.md` and to the PR, for a person.\n\n`protected:` and `silenced:` don't make the gate fail: the reviewer accepts or rejects each one. It exits with 0 (all `PASS`), 1 (any `FAIL`) or 2 (usage error, or a repo with no gate config: that repo has no gate and its tester runs the full suites). Full output goes to `.board/gate/<task>/<repo>.log` (read by the worker, never by the coordinator) and a summary to `<repo>.txt`.\n\n**Turns:** across the whole machine (all hubs) at most `GATE_SLOTS` (2) gates run at once; the rest queue for up to `GATE_WAIT` (40 min) and then run anyway, so a lost turn can't block a task forever. Running several gates at once doesn't finish sooner: they take CPU and memory from each other. Also set `--concurrency` on heavy checks: without it, turbo launches 10 tasks in parallel per gate. And use a shared cache (`--cache-dir=\"$HOME/.cache/turbo/<repo>\"`): each task worktree starts without its own, so without it every gate re-checks everything from scratch; turbo indexes by content, so sharing it is safe.\n\n**Example (a turbo monorepo):** `npx --no turbo run check-types lint --filter='...[{base}]' --concurrency=3` for the checks and the unit tests with `--concurrency=2 -- --maxWorkers=4`, set in the repo's `gate.repos.<repo>.checks`.\n\n## Reviewer\n\nReads the plan and the diff of each folder (untracked files too) and the surrounding code. It applies:\n- **Repo rules**: every `AGENTS.md` and `REVIEW.md` from the file's folder up to the root, the guides they link to, the repo's review skill if it has one, and the personal addition `~/.claude/rubrics/<repo>.md` if it exists.\n- **Contract**: in multi-repo tasks, that both sides agree (endpoint, payload, names, types).\n- **Lenses** according to the spec's surfaces, as a short list in the reviewer's own prompt: `security` → who can call each entry point, input validation, secrets, webhook signatures, errors without internal details (all of it blocks); `ui` → accessible names, keyboard and focus, and the loading / empty / error states the spec asks for (these block; the rest is optional). A diff that needs a lens the spec didn't include gets it anyway.\n- **Over-engineering**: `ponytail-review`. The repo's structure conventions take precedence over \"fewer files\".\n- **Gate lines**: each `protected:` / `silenced:` is accepted only if the plan asks for it and the test still checks what it used to check.\n\nWrites the full report to `rounds/<N>/review.md` and returns `APPROVE` or `CHANGES NEEDED` with one line per blocking finding. Non-blocking items go to `Optional:` and don't change an `APPROVE`. It doesn't run suites (the gate already did, and the tester does). In **fix-round mode** it only checks that each earlier finding is fixed and reviews the delta.\n\n## Tester and ui-tester\n\nAlways a fresh one per assignment. They never edit the repo; their scripts, logs and screenshots go to the directory they are given (`.board/shots/<task>/` in the on-screen test).\n\n**Testing guide** = every `TESTING.md` from the app's folder (or the touched files') up to the repo root, plus the hub's in `testing/<repo>/` (at equal level the hub's wins) and the personal notes `~/.claude/testing/<repo>.md`. What they discover that the guide didn't say comes back as `guideNotes`, which the retro proposes adding.\n\n| Agent · mode | When | What it does |\n|---|---|---|\n| `tester` | After the gate, one per repo; none if that repo's diff doesn't touch code that runs (only manifests, lockfile, type packages, docs or config no test reads), and it says so in `result.md` | Only the repo's e2e tests for what was touched, with its commands (those in `AGENTS.md` or the nearest manifest). In fix rounds, limited to the changed files. With no gate for that repo, the full suites. It doesn't start servers, except the front ends of its own task: in a worktree of a repo with `taskServers`, if an e2e needs them, `factory task-servers <task> start <app…>` and `stop` before reporting (if they were already up, it uses them and leaves them). |\n| `ui-tester` `ui` | With an on-screen test plan, after implementation | Preflight, services (only the `autoStart: yes` ones from the guide), data and users by role; then one Playwright script per flow: console errors, responses ≥ 400, final screenshot (+ 390×844 if the change is UI) and the screenshots from the Capture list with `evidence.json` and crops. |\n| `ui-tester` `capture` | Without an on-screen test, for the critique | Only the screenshots from the Capture list in `ui.md` at 390 and 1280, with measurements and crops. No flows and a single retry. |\n\nWhatever the ui-tester starts by PID it stops before reporting; whatever it starts in the servers panel stays up until the coordinator stops it after the ship.\n\n### Preflight\n\nIf the hub has the `ui-preflight` command (`<hub>/bin/ui-preflight`), the ui-tester runs `factory ui-preflight <task> <app…>` before anything else (and the coordinator once at the start, to ask you early): a script with no model that checks in seconds what used to cost agent rounds and prints `OK | WARN | FAIL` lines, without `.env` values. Without that command, the ui-tester checks the same things using the guide: front-end setup, which API it points at, browser, credentials, local services and backend branch.\n\nA `FAIL` → `BLOCKED` with those lines verbatim as `needsUser`. The ui-tester doesn't investigate or retry on its own.\n\n### On-screen test evidence\n\nEverything lives in `.board/shots/<task>/` (the task's `recursos` panel, or `open .board/shots/<task>`):\n\n| File | Contents |\n|---|---|\n| `<n>-<slug>.png` | Final state of each flow (`-fail`, `-mobile`) |\n| `<task>-<capture>-…png` | Screenshots of each screen at its widths |\n| `<task>-<capture>-<width>-crop.png` | Crop of the dialog/card at 2× |\n| `<task>-<capture>-evidence.json` | Per width: boxes, `gap`, `radius` and `fontSize` of each measurement, horizontal overflow, axe violations, console errors and failed requests |\n\nScreenshots are taken with the capture command named in the `ui` repo's testing guide, or with the ui-tester's own script in the same format when reaching the state takes clicks (a dialog, a menu, a tab). A measurement that finds nothing is a finding.\n\n**Example:** a `capture.mjs` script in the front end's e2e package, which covers some apps and not the ones that need clicks.\n\n## ui-designer\n\nProduct designer for tasks with a `ui` surface. **Never edits code**: it specifies what the worker builds and judges what was built.\n\n### Sources (the first one wins)\n\n1. The repo: `AGENTS.md`, its design guides (tokens, spacing scale, component priority) and, with Figma, whatever design flow the repo has.\n2. What the product already does: the components of the repo's design system (their template, not just their props) and 2–3 neighboring screens of the same app.\n3. `learnings/<repo ui>.md` in the hub.\n4. The **impeccable** skill (pbakaus, Apache 2.0) as knowledge: `operate`, `harden`, `clarify` for planning; `critique`, `audit`, `craft-floor` for critiquing. Its interactive flow is not run.\n\nIt doesn't invent components, tokens or new styles. A component that renders badly with the props needed is not reused as is: it lays out its wrapper and notes it as a bug.\n\n### `plan` mode → `ui.md`\n\nAt most ~60 lines plus the copy table. It covers what is seen; logic and data belong to the spec:\n- **Job**: who arrives, in what situation, and what they must do.\n- **Layout and hierarchy**: each row as **HUG** (its content), **FLEX** (the rest) or **FILL** (parent width) slots, and the gaps as tokens.\n- **Wireframe**: ASCII drawing of each captured screen (desktop and 390 if it changes), with each control's variant.\n- **Components**: element → component (`path`), props and variants. A lone action in a row is `outline`/`secondary` with an icon, never loose text.\n- **States** (loading, empty, error, disabled, success, long text, many items), **copy** in the user's language, **responsive**, **accessibility**, **what to avoid**.\n- **Capture**: 1–3 screens `name · app · route · role · state`, with 2–4 `measure name=selector` lines and `crop <selector>`.\n- **Open**: product decisions with their default value.\n\nThe coordinator saves it as `ui.md` and gives it to the `ui` repo's worker, which builds exactly that; if something doesn't fit the code, it stops and says so.\n\n### `critique` mode\n\nReceives `ui.md`, screenshots after (and before), crops, `evidence.json` and the repo folder; writes to `rounds/<N>/critique.md`:\n1. **Crops first**: small defects aren't visible at 1280.\n2. **Control by control**: label and hint next to their control, looks interactive, aligned with the row's edges, same size as its siblings, wireframe followed.\n3. **Measurements**: gaps on the system's scale and equal where the spec says equal, one radius per element type, `overflowX > 0` = broken layout, axe `serious`/`critical` = accessibility failure. It cites the measured value.\n4. impeccable's heuristics (cognitive load, Nielsen) applied to the screenshots.\n\n\"It matches the spec\" or \"the neighboring screen does the same\" don't excuse a broken layout: an inherited defect still blocks, marked `pre-existing`, with the local fix and the component fix as pending. It returns `APPROVE` or `CHANGES NEEDED`; blocking findings go to the `ui` repo's worker like the reviewer's.\n"}, {"id": "25-entrega", "file": "25-entrega.md", "title": "Delivery and follow-up", "md": "# Delivery and follow-up\n\n## Ship (skill `factory:ship`)\n\nOnly with the task `VERIFIED` (or `BLOCKED` by the on-screen test and with your \"yes\"). The mode comes from `workspace.json` `ship`:\n\n| `ship` | What it does |\n|---|---|\n| `off` (default) | Nothing; tells you it's ready for you to commit and open the PR |\n| `ask` | Prepares commit and PR per repo, shows them to you and waits for your \"yes\" |\n| `draft` / `ready` | Commit, push and PR as a draft or ready for review |\n\nPer repo (the `api` one first, so the `ui` PR can link to it):\n1. **Branch**: it must be the one in the spec's Repos table; otherwise it stops. The repo's git rules take precedence over the skill.\n2. **Files**: only those the workers said they changed, cross-checked with `git status`. Everything else is yours and stays out. Never `git add -A`, `.env*`, logs or screenshots.\n3. **Commit and PR messages**: conventional commits, `<type>(<scope>): <what> (<ticket>)` (no ticket, no parentheses). The PR body is in English: *Needs attention* (what's under \"⚠ Needs attention\"), *Summary* (with the ticket link), *How to test* (the manual QA from `result.md`) and *Notes*.\n4. **Commit** with hooks (never `--no-verify`). A hook that fails because of the code goes back to the worker, a fresh reviewer and the suites before retrying.\n5. **Push** with hooks (never `--no-verify`). If the repo's pre-push is long, it runs in the background.\n6. **PR** against `repos.<repo>.base`. If one already exists for the branch, just push.\n7. **Screenshots** (`ui` repo with an on-screen test): up to 8 images (one per captured screen) that `factory pr-shots` uploads to the repo's `pr-screenshots` branch through the GitHub API (no `git push`, so there are no hooks to skip) and a PR comment with the before/after table and the ✅/❌ list of flows.\n\nIt never merges, approves, force-pushes, pushes to the base branch or rewrites published commits.\n\n## pr-watch\n\n`factory pr-watch` starts with the orchestrator (one instance per hub) and polls GitHub every 2 min using only `gh`. It reads the branches in the Repos table of each active task.\n\n| Detects | Notifies | Result |\n|---|---|---|\n| PR open in all of the task's repos | orchestrator | With a task manager: ticket → `notion.status.pr` |\n| All PRs merged | coordinator · orchestrator | `factory task-end` (the coordinator; the orchestrator only if the coordinator is gone) · ticket → `notion.status.merged` |\n| New review threads or a new review from a bot in `reviewLoop.bots` (stable across two polls) | coordinator | skill `review-loop` |\n| PR in conflict with its base | coordinator (once; again if it comes back) | skill `resolve-conflicts` |\n| Red CI | coordinator (once per failure) | fix round if it's the code's fault; otherwise it tells you |\n\nThe ticket never moves backward (the position in `notion.order` is compared). Without a `notion` key, pr-watch still notifies and nothing is moved. Before waking a coordinator that is no longer working and whose context is over ~100k tokens, it compacts it (`/compact` in Claude, `/summarize` in Cursor): the task's state is on disk.\n\n## Review comments (skill `factory:review-loop`)\n\n1. Reads the unresolved threads and what review bots leave in the body of their review (via `gh api graphql`). A thread is answered when its last comment carries `<!-- factory -->`, the invisible signature of the coordinator's replies. The author isn't checked: the coordinator comments with your GitHub user, so your own comments on your PR count as pending.\n2. Classifies each one: **fix**, **reject** (with the reason in a sentence or two) or **for you** (a product decision, or a comment from a person it can't settle).\n3. Your comments (those from the `gh` user) are your assignments: it fixes them without asking, or answers them if they're a question. For the rest, `reviewLoop.fixes` decides what it fixes without asking: `auto` everything, `bot-auto` only what comes from bots, `ask` (default) shows the classification and waits.\n4. Runs the fix round with the normal loop (the coordinator's fix round: worker → gate → reviewer → tester, and `ui-tester` if it touches a `ui` repo) and pushes to the same branch: `fix(<scope>): address review comments (<ticket>)`.\n5. Replies in each thread (`Fixed in <sha>: …` or the reason) and resolves according to `resolveThreads` (`bot-only`, `all` or `none`, the default).\n6. Records the round in `result.md` → \"PR review\". After `reviewLoop.rounds` rounds (3 by default), it hands the rest over to you.\n\nThe PR is ready to merge when no thread is pending and CI is green. You do the merge.\n\n## Conflicts (skill `factory:resolve-conflicts`)\n\nMerges the base into the task branch (never rebase or force-push), hands the conflicting files to the worker, reviews and tests the resolution, and commits the merge and pushes.\n\n## Retro (skill `factory:retro`)\n\nAfter the ship, the coordinator gathers what was learned: pitfalls, facts the guides lacked or had wrong, data recipes, the tester's `guideNotes`. It proposes them to you **one by one** and writes only what's approved, as a line with date and task in `learnings/<repo>.md`, `learnings/workflow.md` or the testing guide. What's confirmed can be promoted to the repo's `AGENTS.md` or to `context/`. Any kit session can launch it with `/factory:retro`.\n\n## Closing: `factory task-end`\n\nWith the PRs merged, the task's coordinator runs it (notified by `pr-watch`). If the coordinator is gone, the orchestrator does it:\n```sh\nfactory task-end <task>              # archives the change; its requirements move to openspec/specs/\nfactory task-end <task> --discard    # discarded: archives without touching openspec/specs/\n```\nIt stops the task's servers, removes worktrees (git refuses if there are uncommitted changes) or links, archives into `openspec/changes/archive/<date>-<task>/` (or `briefs/archive/`) and closes the Herdr workspace by its id.\n"}, {"id": "26-auditorias-tareas-aprendizajes", "file": "26-auditorias-tareas-aprendizajes.md", "title": "Audits, task manager and learnings", "md": "# Audits, task manager and learnings\n\n## Auditor\n\nA separate session (`factory audit-start <repo> <type> [scope]`, or by asking the orchestrator) in the `audit · <repo>` or `review · <repo>` workspace. It never modifies the audited repo or runs its code.\n\n| Type | What it does |\n|---|---|\n| `security` | Cloudflare's `security-audit` skill in full mode: reconnaissance, parallel hunters, independent verifiers and validators in Node. Anything that would need to run code is left as `needs_validation`. Profile and budget: `claude.auditProfile` / `auditBudget` (`quick`, 12 agents); `AUDIT_PROFILE=deep` for a single pass. It is expensive. |\n| `quality` | `ponytail-audit` (over-engineering) + the repo's rubric (`REVIEW.md`, its guides, its review skill) with scouts per area + test gaps in critical code (without running them). |\n| `review` | Review of a specific target (paths, PR `#123` or branch): performance, repo rules, bugs, basic security and simplification. It reads the PR or branch without checking it out. |\n| `all` | `security` + `quality` |\n\nResult: `audits/<repo>/<date>-<types>/REPORT.md` (in the user's language, prioritized, with `path:line`) and `findings.json`. It then offers to create tasks (task-creator, if there is a task manager) or to hand the findings to the orchestrator as a new task.\n\n`audit-start` requires a git repo and a Herdr session. To audit the hub itself (which may not be a repo with history), use parallel reviewers from a normal session.\n\n## Task manager: Jared and task-creator\n\nThe task manager is optional and pluggable. Without `tracker` or `notion` in `workspace.json`, tasks come in through the chat or `factory task`, and the orchestrator offers to jot ideas down in `BACKLOG.md`. With one, the orchestrator loads that tracker's adapter (`trackers/<type>/TRACKER.md`, see [`trackers/README.md`](../trackers/README.md)) to read tickets and move their status. Notion is the adapter that ships: `factory notion-page` reads tickets, the `notion` panel lists your tasks, and Jared creates new ones. Another tracker (Linear, Jira, GitHub Issues…) is a `TRACKER.md` with four operations, written in your hub; it can also just write to `.board/inbox/`.\n\n**Jared** (Sonnet, workspace `jared`) is the task-creation coordinator, separate from the orchestrator so you can talk to him on his own. The orchestrator hands him requests (`.board/jared/<date>.md` + `factory jared`).\n\n1. **Draft**: calls `task-creator` in `mode: draft` (one per independent need).\n2. **Shows** per task: title, project, type, priority, SPs, links between tasks, checklist items that fail and duplicates found; then the questions.\n3. **Edits** with you and **creates** only after your explicit \"yes\" (`mode: create`). \"Save it\" → draft in `personal/drafts/`.\n4. Optional: \"tell the orchestrator to start `<ticket>`\" → `factory task \"Start <ticket>\"`, which reaches this hub's orchestrator and not another one open in Herdr.\n\nHe also updates existing tasks (`mode: update`, showing `field: before → after`) and creates tasks from your personal backlog (`personal/backlog/*.md`), marking the item as planned afterwards.\n\n**task-creator** (Sonnet) applies the team's guide (skill `tech-task-creator`, which re-reads the guide in the task manager every time): it looks for duplicates, reads the real code for routes and endpoints, and doesn't set an assignee, sprint or status unless given one. It never deletes pages or creates anything without an approved draft. It is used by Jared, the coordinators (for follow-ups) and the auditor.\n\n## Learnings: retro and `learnings/`\n\nThe factory improves task by task by saving, in each hub, what was costly to discover. The bar is \"without this, the next task here would lose a round\".\n\n```\ntask → retro (candidates) → your \"yes\" per item → learnings/<repo>.md · learnings/workflow.md · testing/**/TESTING.md\n                                                      ↓ confirmed and stable\n                                               the repo's AGENTS.md · context/\n```\n\n- **Candidates**: what had to be discovered, wrong assumptions that cost a round, documentation lines that turned out to be false, your corrections and the testers' `guideNotes`. Left out: what can be read in the code or the sp

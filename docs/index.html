ec, and what only mattered to this task.\n- **Format**: a line of up to 200 characters, `date · type · text · task · author`, with type `trampa`, `hecho`, `receta` or `cómo trabajamos`, in the section for the service or app.\n- **Approval**: at most 5 candidates, ordered by the round they would save; only what you approve is written. A wrong guide line is fixed in place, not supplemented with another.\n- **Who reads them**: coordinator and specker before planning (the section for what the task touches), the ui-designer (the `ui` repo's section) and the workers, through the coordinator.\n- **Never**: secrets, tokens, real personal data or absolute paths of the machine.\n\nWhat holds for any project (not for one repo) doesn't go in the hub's `learnings/`: it's an engine change.\n"}, {"id": "27-hubs-y-sesiones", "file": "27-hubs-y-sesiones.md", "title": "Hubs, sessions and extensions", "md": "# Hubs, sessions and extensions\n\nHow the factory finds the hub you work in, how its sessions start, and how a hub adds its own things without touching the engine.\n\n## The `factory` command\n\nInstalled once: `~/.local/bin/factory` is a link to the engine's `bin/factory`. It does three things:\n\n| Form | What it does |\n|---|---|\n| `factory <command> [args]` | Runs the engine's `bin/<command>` on the hub you are in (`factory task-start …`, `factory gate …`) |\n| `factory <hub command> [args]` | If the engine doesn't have it, runs `<hub>/bin/<command>`: a project's own commands |\n| `factory <agent> [claude args]` | Starts that kit agent (`factory orchestrator -n orchestrator` = `factory claude-kit orchestrator -n orchestrator`) |\n\n`factory` with no arguments lists the engine's commands, the hub's and the agents.\n\n## Which hub is used\n\n`bin/lib/hub.sh`, which every script loads, resolves the hub in this order:\n\n1. `$FACTORY_HUB`, if set.\n2. The nearest `workspace.json` walking up from the current directory (from a task, `.tasks/<task>/<repo>`, it also finds its hub).\n3. The default hub, at `~/.config/factory/hub` (used by the Herdr keys, which run outside any hub).\n\nIt also sets `ENGINE` / `FACTORY_HOME` (the engine) and `HUB_LABEL`: the label of the orchestrator's Herdr workspace, `hub` for the default hub or one with its own session, and `hub · <folder>` for the others. This way you can have two hubs open at once without their orchestrators getting mixed up.\n\n## One hub per Herdr session\n\nWith several hubs, each one can live in its own Herdr session: a separate server with its own workspaces, panes and agents, and the same `~/.config/herdr/config.toml` (keys and sidebar). One Ghostty window or tab per hub and nothing gets mixed: the sidebar and `herdr agent list` only show that hub's.\n\n1. In the hub's `workspace.json`: `\"herdr\": {\"session\": \"<name>\"}`; optionally `\"title\"` (the title of its Ghostty window) and, for its dock icon, `\"color\"` (`#RRGGBB`: the icon's screen) or `\"icon\"` (a Ghostty icon such as `xray` or `retro`, or the path to an image).\n2. Open it with `factory open` from the hub (or from any terminal with `FACTORY_HUB`): a Ghostty window attached to `herdr --session <name>` (created if it doesn't exist) and, if its orchestrator isn't running, it starts it there. By hand: `herdr --session <name>` and inside it `factory orchestrator -n orchestrator`. Careful: if your Ghostty has `command = herdr`, a normal new window goes to the default session.\n\n### All hubs in one window\n\nInstead of one window per hub, a single one that switches hubs: put `command = ~/.local/bin/factory hubs` in your `~/.config/ghostty/config` (or run it in any terminal). It asks which hub (the OpenSpec stores with `herdr.session`), attaches to its session and starts its orchestrator if it isn't running. To switch, `alt+f` inside Herdr: you pick another hub and the window moves to its session; the previous one keeps running (orchestrator, tasks, `pr-watch`). When you leave Herdr (`ctrl+b q`) the selector returns; `esc` in it closes the window. Without an open `factory hubs` window, `alt+f` opens the chosen hub in its own window, like `factory open`. The window title is the hub's `herdr.title`; the dock icon is Ghostty's (only `factory open` changes it per hub).\n\nInside Herdr every pane already carries its session's socket, so the orchestrator, coordinators, `pr-watch`, `sys-watch` and the keys talk to their own. Outside Herdr (`factory task \"…\"` from a terminal), `hub.sh` exports `HERDR_SESSION` and `HERDR_SOCKET_PATH` (`~/.config/herdr/sessions/<name>/herdr.sock`) for the hub's session. If you start its orchestrator in another session, `claude-kit` warns you.\n\nWhen you move a hub to its own session: tasks already running in the previous one end there; close its old orchestrator and start it again in the new one.\n\n## Kit sessions\n\nEvery kit session starts with `--plugin-dir <engine>/kit --settings \"$(bin/lib/kit-settings)\"`. `kit-settings` writes `<hub>/.board/kit-settings.json` from `bin/lib/kit-settings.json` and adds to it:\n- `env.FACTORY_HUB` and `env.FACTORY_HOME`, which hooks, agents and skills use to find the hub and the engine;\n- the engine as an extra directory (`permissions.additionalDirectories`).\n\n`kit-settings.json` also turns off global plugins that have nothing to do with the factory, so you don't pay for their tools on every turn, and carries read `deny` rules on `.env` and `.env.*`: the harness checks them before any classifier, so \"`.env*` files are never read\" doesn't depend on the prompt alone (they don't stop a script the agent runs from opening them: a sandbox would limit that). A kit change is picked up when the session **starts**: an open orchestrator or coordinator keeps the kit it started with.\n\n## Provider: Claude or Cursor\n\nKit sessions start with Claude Code or with Cursor CLI (`cursor-agent`), for all hubs:\n\n```sh\nfactory provider            # which one is set, its models, and whether new tasks are diverted to Cursor\nfactory provider cursor     # new sessions use Cursor; open ones keep theirs (restart them)\nfactory provider claude\n```\n\nThe orchestrator starts with the provider that is set. If Claude doesn't respond, run `factory provider cursor` and restart the orchestrator (`factory orchestrator -n orchestrator` or `factory open`): that session is `cursor-agent`, and so are new tasks. A new task's coordinator starts the same way, and its team (specker, worker, reviewer, tester) runs inside that session. When the provider is still Claude and a live usage window (5 h or weekly, whichever the status line stores in `~/.cache/factory/usage.json`) is at 95 % or more, `task-start` starts that coordinator on Cursor and the orchestrator stays on Claude. Sessions already open keep theirs. When the window resets, the next task goes back to Claude. The `.board/tasks/<task>.json` record stores `provider`.\n\nWith Cursor the same kit is loaded (`--plugin-dir`: agents and skills). `bin/lib/kit-dir` generates `<hub>/.board/kit-cursor` with each agent's `model:` translated and an \"Environment\" section (hub and engine paths, model equivalences, what to do without Claude Code's own tools). The orchestrator's tells it to route with `factory task-start` and not to launch workers. The agent's role goes in the first prompt, because Cursor has no `--agent`, and permissions are `--force` (Run Everything: it doesn't stop at the plan or at each command) plus `--approve-mcps`. The coordinator doesn't read the repo (that's the scout, which stops after 25 turns) and, if a subagent model is rejected, it uses another of the same tier instead of moving up to its own. Default models are Grok's (`bin/lib/providers.json`): `opus` → `grok-4.7-high`, `sonnet` → `grok-4.7-medium`, `haiku` → `grok-4.7-low`. The coordinator starts on the `opus` one (whoever decides, as in Claude). The worker and reviewer come from the hub's `routing`; `kit-dir` writes that table already translated into the coordinator's Environment section, because Cursor doesn't accept the names `haiku`/`sonnet`/`opus`. To change them, use `~/.config/factory/providers.json`, which takes precedence over the engine's:\n\n```json\n{\"cursor\": {\"models\": {\"opus\": \"claude-opus-5-thinking-high\", \"sonnet\": \"gpt-5.6-luna-high\"}}}\n```\n\n`cursor-agent --list-models` gives the names. From 95 % of a window, new tasks move the coordinator to Cursor on their own; at 100 %, `sys-watch` warns that the window is exhausted and until when. When it resets, it warns that tasks go back to Claude (if the provider was changed by hand, the warning includes `factory provider claude`). What doesn't work with Cursor yet is listed in [limits](33-limites.md#cursor).\n\n## What goes in the hub and not in the engine\n\n| In the hub | What for |\n|---|---|\n| `workspace.json` | Repos and their roles, approvals, gate, servers, panels, models by risk, task manager |\n| `AGENTS.md` (= `CLAUDE.md`) | Repo map, base branches and branch names, ticket format, what is never touched |\n| `<hub>/bin/<command>` | Own commands, run with `factory <command>`. The engine calls some if they exist: `task-servers` (per-task servers) and `ui-preflight` (on-screen test checks) |\n| `<hub>/.claude/skills/` | Own skills; they also load in `.tasks/<task>/` sessions |\n| `<hub>/panels/<name>.sh` | Own panels for `panels.hub` (or replacing an engine one with the same name). Same format as the engine's `panels/` |\n| `context/`, `testing/`, `learnings/`, `decisions/`, `openspec/`, `briefs/`, `audits/`, `personal/`, `BACKLOG.md` | The project's knowledge and specs |\n\n**Example:** a `task-servers` command (front ends per worktree in their own port slot) and a `ui-preflight` command, plus a `docker` skill (what can be done with the local stack) and a `task-servers` skill (port slots and the recipe for its worktrees).\n\n## Extensions: tuning agents from the hub\n\nA hub adds its own things without touching the engine:\n\n| What | Where | How it reaches the agents |\n|---|---|---|\n| Skills | `<hub>/.claude/skills/<name>/SKILL.md` | Every session of the hub and its tasks sees them; an agent loads them by their description or because `agents` asks it to |\n| Per-agent settings | `workspace.json` → `agents.<agent>`: `skills`, `tools`, `notes` | On every start `bin/lib/kit-dir` generates `<hub>/.board/kit`: the engine's kit, linked, and the named agents with a \"This hub\" section at the end (skills to load, tools, notes) and those tools in their `tools` list |\n| MCP | `<hub>/.mcp.json` | Not yet enabled: it needs `enableAllProjectMcpServers` in `bin/lib/kit-settings.json` (change it yourself; it's a permission) and the server in `agents.<agent>.tools` as `mcp__<server>` (all its tools) |\n| Commands | `<hub>/bin/<command>` | `factory <command>`; the engine calls some if they exist |\n\nWithout `agents`, the hub uses the engine's kit as is. An engine change still arrives immediately: the hub's copy is rebuilt on every start.\n\n**Example:** a read-only database MCP given to a single agent: its server in `<hub>/.mcp.json` and `\"agents\": { \"worker\": { \"tools\": [\"mcp__<server>\"], \"notes\": \"Read-only queries only.\" } }`. Another: a `design-system` skill in `.claude/skills/` and `\"agents\": { \"ui-designer\": { \"skills\": [\"design-system\"], \"notes\": \"…\" }, \"worker\": { \"skills\": [\"design-system\"] } }`.\n\n## Changing the engine\n\n- A change here arrives immediately in all hubs. What is already open doesn't see it: restart the orchestrator or coordinator; for an open panel, `factory hub-panel --replace`. `pr-watch` and `sys-watch` are single-instance: to change their code, kill them and restart the orchestrator.\n- Never test something that launches work against a live hub (a task in `.board/inbox/` gets executed by its orchestrator). Use a throwaway hub: `factory hub-init <scratch>/x probe-x` and, when done, `openspec store unregister probe-x`.\n- To check: `bash -n` on the scripts touched, `factory panel <name> --rows ''` and a short session with the kit: `claude -p --model haiku --plugin-dir kit --settings \"$(bin/lib/kit-settings)\" \"<question>\"` from a hub.\n"}, {"id": "30-herramientas", "file": "30-herramientas.md", "title": "Tools", "md": "# Tools\n\nEverything deterministic lives in scripts: it is cheaper, faster, and fails differently than a model does. Agents call them; you can too. They all run as `factory <command>` and work on the hub resolved by `bin/lib/hub.sh` ([Hubs, sessions and extensions](27-hubs-y-sesiones.md#which-hub-is-used)).\n\n## Engine commands (`bin/`)\n\n### Hubs and sessions\n\n| Command | What it does |\n|---|---|\n| `factory` | With no arguments: lists engine commands, hub commands and agents |\n| `hub-init <folder> [store]` | Creates a hub from `templates/hub/` with its OpenSpec store and its git |\n| `claude-kit <agent>` (or `factory <agent>`) | The provider CLI (`claude` or `cursor-agent`) with the kit loaded. With `orchestrator` it also renames the workspace to `HUB_LABEL`, opens the hub panel and starts `pr-watch` and `sys-watch` (one instance of each). With Cursor it prints `orquestador: cursor` |\n| `task \"<what and why>\" [repo…]`, `task -f <file>` | Drops tasks into `.board/inbox/` and notifies the hub's orchestrator if it is running ([Day to day](15-dia-a-dia.md#handing-over-a-task)) |\n\n### Task lifecycle\n\n| Command | What it does |\n|---|---|\n| `task-start <task> <repo>:<branch>:<base>…` | Prepares branches, worktrees and `setup`; opens the workspace and starts the coordinator ([Lifecycle of a task](21-ciclo-de-una-tarea.md#1-request-and-start--orchestrator)) |\n| `task-move <task>` | Moves a task from a worktree to the main checkout, keeping uncommitted work |\n| `task-end <task> [--discard]` | Stops servers, removes worktrees/links, archives and closes the workspace |\n| `open` | Opens the hub's own Herdr session (`herdr.session`) in a new Ghostty window and starts its orchestrator if it is not running ([Hubs, sessions and extensions](27-hubs-y-sesiones.md#one-hub-per-herdr-session)) |\n| `provider [claude\\|cursor]` | What the kit sessions start with, across all hubs, and their models. With Claude at 95% or more, new tasks start the coordinator in Cursor ([Hubs, sessions and extensions](27-hubs-y-sesiones.md#provider-claude-or-cursor)) |\n| `usage` | Claude account usage: % of the 5 h and weekly windows and when they reset, from the status line of the last kit session (`bin/lib/statusline` saves it to `~/.cache/factory/usage.json` and then runs your own status line). It also appears at the top of the hub's `agentes` panel. A Cursor session does not update it |\n| `ctx [N\\|task]` | Context of the last tasks or of one: base, peak, turns and what each tool returned. Reads the Claude transcript and, if the task ran in Cursor, the Cursor one |\n| `task-end --stale [--yes]` | Open tasks whose PRs are all merged or closed: lists them and, if you confirm, closes them (closed without merge → `--discard`). For tasks whose coordinator never got to close them; skips their retro |\n| `gate <task> [repo…]` | Hub checks over the task's repos, plus `protected:` / `silenced:` / `attention:` ([Quality: gate, review, tests and design](24-calidad.md#gate)) |\n| `pr-shots <repo> <pr> <images…>` | Uploads a PR's screenshots to the `pr-screenshots` branch through the GitHub API and prints their URLs |\n| `task-panel <pane> <folder>` | Reopens a coordinator's detail panel |\n| `pr-watch [--once]` | Watches PRs, comments, conflicts and CI ([Delivery and follow-up](25-entrega.md#pr-watch)) |\n| `audit-start <repo> <type> [scope]` | Auditor in its own workspace ([Audits, task manager and learnings](26-auditorias-tareas-aprendizajes.md)) |\n| `changelog [period]` | Changelog session in its `changelog` workspace: new features, improvements and fixes for the period, with videos ([Day to day](15-dia-a-dia.md#period-changelog)) |\n| `jared <request>` | Starts Jared or hands it a request |\n\n### View and navigate\n\n| Command | What it does |\n|---|---|\n| `board` | Live tree: orchestrator, coordinators and their subagents with description and duration. On Claude they come from the hook; on Cursor, from the session transcript |\n| `dash [port]` | The same tree as `board`, drawn as a diagram on a local web page (`127.0.0.1:7717`, opens by itself): left to right, the orchestrator, arrows to each coordinator (one per row) and, from each coordinator, arrows to its subagents in execution order, grouped into phases: `spec`, `build` and `round N` (a batch of fixes and the reviews it triggers; inferred from the agent type). A collapsed phase is a single node; open, its runs appear in a dashed box. Clicking a coordinator or a phase collapses or expands it (working coordinators and the running phase start open; `expandir`/`plegar` for everything). Whatever is working is drawn in peach with a moving line. Reads `herdr agent list` and `.board/`, keeps no state of its own; refreshes every 2 s. Page: `templates/dash.html` |\n| `review` | A task's changes: branch → base, commits, files with `+/-`, diff with delta; `enter` opens the diff in Neovim |\n| `changes` | lazygit in the repo you are in |\n| `edit` | Neovim in the repo you are in |\n| `prs` | Your open PRs (in the org of the hub's repos): review state, checks, pending threads |\n| `servers` | Dev servers of the main checkout (`servers`): which are up, start and stop |\n| `inbox`, `notion-page <ticket>` | Notion adapter: your tasks by priority, and a ticket saved in `.board/notion/` so it can be read in pieces |\n| `panel <name>` | Common panel engine (fzf): `panels/<name>.sh` defines list, actions and help (`panels/README.md`) |\n| `hub-panel`, `fold`, `goto`, `keys` | Herdr layout: hub panels, minimize, jump by label, cheat sheet (`alt+h`) |\n| `ctx [N \\| <task>]` | Context hygiene for task sessions, from the transcripts |\n| `docs [--no-open]` | Generates (and opens) this documentation as a web page (`docs/index.html`) |\n\n### Hub commands\n\n`factory <command>` looks first in the engine's `bin/` and then in `<hub>/bin/`. The engine calls two of them if they exist:\n\n| Hub command | Called by | Purpose |\n|---|---|---|\n| `task-servers <task> …` | task-start, task-move, task-end, sys-watch, ui-tester, worker | Per-worktree servers for the repos with `taskServers` ([Repos, worktrees and environments](22-repos-worktrees-entornos.md#per-task-servers-taskservers)) |\n| `ui-preflight <task> <app…>` | ui-tester, coordinator | On-screen test requirements in seconds, `OK/WARN/FAIL` ([Quality: gate, review, tests and design](24-calidad.md#preflight)) |\n\n### Watchers (start with the orchestrator)\n\n- **`pr-watch`**: every 2 min, `gh` only. Notifies the orchestrator or the coordinator once per change. Log in `.board/pr-watch.log`.\n- **`sys-watch`**: every minute it kills whatever is surely dead (orphaned test workers, processes of already-closed tasks), stops task servers that have no folder, and notifies you (macOS notification) if the system reports memory pressure (`kern.memorystatus_vm_pressure_level`, not the swap %, which on macOS almost never drops), if a process burns CPU for minutes, or if a task's coordinator has been \"working\" in Herdr for `STUCK_MINUTES` (20) with no change in its transcript or those of its subagents, Claude or Cursor (hung command, lost subagent). It also warns when a Claude usage window (5 h or weekly) passes 80% and 95%. Log in `.board/sys-watch.log`.\n\nThey are single-instance: to change their code, kill them and restart the orchestrator.\n\n## Panels (`panels/`)\n\n| Panel | Where | What |\n|---|---|---|\n| `agentes` | hub and task | `factory board` (in a task, only its session) |\n| `tareas` | hub | `.board/inbox/` inbox (`factory task --list`) |\n| `notion` | hub | `factory inbox` (only with a task manager) |\n| `prs` | hub | `factory prs` |\n| `servidores` | hub | `factory servers` |\n| `recursos` | task | Screenshots from `.board/shots/<task>/` |\n\nA new panel: a `panels/<name>.sh` file and its name in `panels.hub`. Try it standalone with `factory panel <name>` or `factory panel <name> --rows ''`.\n\n## Kit hooks (`kit/hooks/hooks.json`)\n\n| Hook | Script | Purpose |\n|---|---|---|\n| `PreToolUse` / `PostToolUse` (Agent), `SubagentStart`, `SubagentStop` | `subagents.sh` | Records each session's subagents in `.board/<session_id>` (for `board`) and mirrors them in the Herdr pane bar |\n| `SubagentStop`, `Stop` | `reap-tests.sh` | Kills orphaned vitest/jest workers (parent PID 1), which can take GBs each |\n\n## `local-db` MCP\n\n`kit/mcp/local-db.mjs` (Node, no dependencies), registered in `kit/.mcp.json`; it reaches every session that loads the kit. Tools `mysql_query` and `mongo_eval` against the hub's **local** DBs, configured with `workspace.json` → `localDb` (docker compose project and service of each engine; without the key it offers none). It goes through `docker exec`, so passwords never leave the containers. Read and write of data, never of schema (`CREATE`, `ALTER`, `DROP`, `TRUNCATE`, `drop()`, `renameCollection`…), and at most 200 rows in MySQL. Needs the stack up. The tester uses it to create data for its flows. Test: `node kit/mcp/local-db.mjs --self-test`. A new kit MCP: an `.mjs` in `kit/mcp/` and its entry in `kit/.mcp.json`.\n\nProduction MCPs are not part of the kit. An agent only reaches one if the hub grants it (`agents.<agent>.tools`) and its `AGENTS.md` allows it, and only to read: you never write to production.\n\n## Herdr\n\nOne workspace per main session:\n\n| Workspace | Contents |\n|---|---|\n| `hub` (or `hub · <folder>` if it is not the default hub) | Orchestrator + `panels.hub` panels (and a `servidores` tab with one `srv:<name>` pane per server) |\n| `<ticket>` or `<task>` | Coordinator + detail panel (`agentes`, `recursos`, `cambios`) |\n| `jared`, `audit · <repo>`, `review · <repo>` | Jared and audits, with their agents on the right |\n\n`herdr agent list` returns the agents of **all** hubs: scripts pick the orchestrator by title **and** by the hub's `cwd`. Shortcuts in [Day to day](15-dia-a-dia.md#shortcuts). The `factory:herdr` skill tells agents how to read and send messages to other panes without touching yours.\n"}, {"id": "31-configuracion", "file": "31-configuracion.md", "title": "Configuration: `workspace.json`", "md": "# Configuration: `workspace.json`\n\nA file at the root of each hub; its presence is what makes a folder a hub ([Hubs, sessions and extensions](27-hubs-y-sesiones.md#which-hub-is-used)). Scripts read it with `jq` and pass what is needed to the coordinator in its first message; prompts read the rest when they need it. A change affects tasks that start afterward. `factory task-start` saves the values each task ran with in `.board/tasks/<task>.json`.\n\nTwo complete examples: `templates/hub/workspace.json` (what `factory hub-init` copies) and `examples/web-app/workspace.json`.\n\n## Task flow\n\n| Key | Values | Default | Read by | Effect |\n|---|---|---|---|---|\n| `approvals.spec` | `ask` · `auto` | `ask` | task-start → coordinator | Does it wait for your \"yes\" on the spec? |\n| `approvals.plan` | `ask` · `auto` | `ask` | task-start → coordinator | Does it wait for your \"yes\" on the plan? (the `routing` row can override it) |\n| `openspec` | `auto` · `always` · `never` | `auto` | specker | Full or light spec ([Spec and plan](23-spec-y-plan.md)) |\n| `ship` | `off` · `ask` · `draft` · `ready` | `off` | task-start → coordinator | What it does when finished ([Delivery and follow-up](25-entrega.md)) |\n| `uiTests` | `on` · `off` | `on` | task-start → coordinator | On-screen test on tasks that touch a `ui` repo |\n| `uiEnv` | `demo` · `local` | `demo` | task-start, coordinator, ui-tester | What the on-screen test runs against ([Repos, worktrees and environments](22-repos-worktrees-entornos.md#on-screen-test-environment-uienv)) |\n| `worktrees` | `false` · `\"on-demand\"` · `true` | `false` | task-start, task-move | Main checkout or worktree ([Repos, worktrees and environments](22-repos-worktrees-entornos.md#main-checkout-or-worktree)) |\n| `claude.parallel` | number | `2` | all main sessions | Simultaneous subagents |\n| `claude.auditProfile` | `quick` · `standard` · `deep` | `quick` | audit-start | Depth of the security audit (`AUDIT_PROFILE` overrides it for one run) |\n| `claude.auditBudget` | number | `12` | audit-start | Maximum agents in an audit |\n\nWithout an approval key, it asks (`ask`). With `auto`, doubts do not stop the work: the reasonable option is chosen and recorded as \"Decision: …\".\n\n## `repos`\n\nOne object per repo; the key is its path relative to the hub. Details in [Repos, worktrees and environments](22-repos-worktrees-entornos.md#the-hubs-repos).\n\n| Key | Values | Default | Read by | Effect |\n|---|---|---|---|---|\n| `repos.<repo>.roles` | list of `ui` · `api` · `infra` | `[]` | task-start → coordinator | How the task is planned: UI spec, on-screen test, testing guides |\n| `repos.<repo>.base` | branch | `main` | task-move, ship, orchestrator (with the `AGENTS.md` table) | Starting branch and PR target |\n| `repos.<repo>.worktrees` | same as `worktrees` | — | task-start, task-move | Overrides `worktrees` for this repo |\n| `repos.<repo>.setup` | shell command | — | task-start | Prepares each new worktree, with `$SRC` = main checkout; log in `.board/setup/` |\n| `repos.<repo>.taskServers` | `true` · `false` | `false` | task-start, task-move, tester, worker | Its servers run per worktree with the hub's `task-servers` |\n\n## `gate`\n\nRead by `factory gate` ([Quality: gate, review, tests and design](24-calidad.md#gate)).\n\n| Key | Values | Effect |\n|---|---|---|\n| `gate.repos.<repo>.checks` | list of commands; `{base}` → `origin/<base>` | What the repo has to pass. A repo with no entry has no gate. |\n| `gate.repos.<repo>.base` | branch | The base for `{base}` (separate from `repos.<repo>.base`; keep them equal) |\n| `gate.protected` | globs | Existing files (tests, configs) whose change is reported as `protected:` |\n| `gate.attention.<label>` | globs | Files reported as `attention:` in `result.md` and the PR (`migration`, `dependencies`, `ci/deploy`, `env`…) |\n\n## `routing`\n\nOne row per risk level (`tiny`, `low`, `medium`, `high`), which the coordinator takes from the spec's Risk section ([Spec and plan](23-spec-y-plan.md#risk-and-routing)).\n\n| Key | Values | Effect |\n|---|---|---|\n| `routing.<level>.worker` | `haiku` · `sonnet` · `opus` | Workers' model |\n| `routing.<level>.reviewer` | same | Reviewer's model |\n| `routing.<level>.reviewerEffort` | `low` · `medium` · `high` | Reviewer's effort |\n| `routing.<level>.planApproval` | `ask` · `auto` | Optional: overrides `approvals.plan` at that level |\n\nThe template ships: `tiny` haiku/sonnet medium, `low` sonnet/sonnet medium, `medium` sonnet/sonnet high, `high` opus/opus high with `planApproval: ask`. With Cursor, those names are translated to the provider's models (Grok by default: `haiku` → `grok-4.7-low`, `sonnet` → `grok-4.7-medium`, `opus` → `grok-4.7-high`) and the coordinator launches each subagent with the already-translated id. The coordinator itself stays on the `opus` one.\n\n## `reviewLoop`\n\n| Key | Values | Default | Read by | Effect |\n|---|---|---|---|---|\n| `reviewLoop.fixes` | `auto` · `bot-auto` · `ask` | `ask` | review-loop | Which comments it fixes without asking |\n| `reviewLoop.resolveThreads` | `bot-only` · `all` · `none` | `none` | review-loop | Which threads it resolves after replying |\n| `reviewLoop.bots` | GitHub logins | `[]` | pr-watch, review-loop | Who counts as a review bot |\n| `reviewLoop.rounds` | number | `3` | review-loop | Fix rounds per PR |\n\n## Herdr, servers and local DB\n\n| Key | Values | Default | Read by | Effect |\n|---|---|---|---|---|\n| `herdr.session` | name | — | hub.sh, claude-kit | The hub's own Herdr session ([Hubs, sessions and extensions](27-hubs-y-sesiones.md#one-hub-per-herdr-session)): outside Herdr, commands go to it and its workspace is called `hub` |\n| `herdr.title` · `herdr.color` · `herdr.icon` | text · `#RRGGBB` · Ghostty icon (`xray`, `retro`, `holographic`, `blueprint`, `chalkboard`, `microchip`, `glass`, `paper`) or a path to an image (png/jpeg/icns; relative to the hub, e.g. `icon.png`) | hub folder · — · — | open | Fixed title of its Ghostty window and its dock icon, to tell hubs apart: `icon` if present; otherwise the official one with the screen in `color` |\n| `panels.hub` | panel names: the engine's (`agentes`, `tareas`, `notion`, `prs`, `servidores`) or the hub's (`<hub>/panels/<name>.sh`) | — | hub-panel | Panels to the right of the orchestrator, in that order. A hub panel with the name of an engine one replaces it ([panels](../panels/README.md)) |\n| `servers[]` | `{name, repo, cmd, ready, docker?, open?}` | `[]` | servers, ui-tester | Dev servers of the main checkout: `ready` is the URL that says it is up; `docker: true` is never stopped from here; `open: true` opens in the browser |\n| `localDb` | `{project, mysql?, mongo?, notes?}` | — | kit `local-db` MCP | Docker compose project and service of each local DB engine; `notes` goes into the tool description. Without the key, the MCP offers no tools |\n| `taskServers` | number | `2` | the hub's `task-servers` (not the engine) | Tasks with servers running at once, if the hub implements that command that way |\n\n**Example:** `localDb: { \"project\": \"<your compose project>\", \"mysql\": \"mysql\", \"mongo\": \"mongodb\", \"notes\": \"one DB per service…\" }`.\n\n## `tracker` (task manager, optional)\n\nThe tracker is pluggable: see [`trackers/README.md`](../trackers/README.md). Without `tracker` or `notion` there is no tracker: requests go through `factory task` and the orchestrator offers to note them in `BACKLOG.md`.\n\n| Key | Values | Read by | Effect |\n|---|---|---|---|\n| `tracker.type` | adapter name (`notion` ships with the engine) | orchestrator | Which `trackers/<type>/TRACKER.md` it loads (the hub's own `<hub>/trackers/<type>/` wins). Default `notion` if the hub has a `notion` key |\n| `tracker.<anything else>` | free-form | the adapter | Settings the adapter's `TRACKER.md` reads (status map, order, project keys…) |\n\n## `notion` (task manager, optional)\n\nWithout the `notion` key there is no task manager: no `notion` panel, no Jared or task-creator; pr-watch does not ask to move statuses and the orchestrator offers to write requests down in `BACKLOG.md`. With it, the factory uses Notion as its task-manager adapter. Its prompts and scripts still assume a specific ticket format (ids like `PROJ-123`, a given tasks database): generalizing it is pending ([limits](33-limites.md)).\n\n| Key | Values | Read by | Effect |\n|---|---|---|---|\n| `notion.idPrefix` | ticket prefix, e.g. `PROJ` | inbox, notion-page | Tickets are `<idPrefix>-<n>` (default `PROJ`) |\n| `notion.tasks` | `collection://…` | orchestrator, inbox, notion-page, task-creator | Tasks database |\n| `notion.idProperty` · `notion.statusProperty` | property names | orchestrator, notion-page | How to find a ticket by its number and which property to move |\n| `notion.status` | `started` · `pr` · `merged` → value | orchestrator | Statuses it moves to |\n| `notion.order` | list of statuses | orchestrator | To never move backward |\n| `notion.sprints` | `collection://…` | inbox | Sprints for the `notion` panel: current sprint, next, backlog tabs and dates |\n| `notion.me` | `https://app.notion.com/p/…` | inbox | Your page in the people database: the `notion` panel also counts tasks whose `Assignee` (relation) is you, even if the person field is empty |\n\n## `agents` (per-agent extensions, optional)\n\n| Key | Values | Read by | Effect |\n|---|---|---|---|\n| `agents.<agent>.skills` | hub skill names | `bin/lib/kit-dir` | The agent loads them before starting (and gains the `Skill` tool if it did not have it) |\n| `agents.<agent>.tools` | tools, e.g. `mcp__<server>` | `bin/lib/kit-dir` | Added to its `tools` list (a whole MCP server with `mcp__<server>`) |\n| `agents.<agent>.notes` | text | `bin/lib/kit-dir` | Hub instructions at the end of its prompt |\n| `agents.<agent>.codeMode` | `true` | `bin/lib/agent-args` | **Experimental.** Starts the agent in Claude Code's [Code Mode](https://code.claude.com/docs/en/code-mode): it writes JavaScript that chains tools and only reads the result. Only with the `claude` provider, in an interactive session, Claude Code ≥ 2.1.323; the first time it asks you to confirm. It does not start with OpenTelemetry telemetry, `ANTHROPIC_BASE_URL` or some plugins (`/status` says why). Try it in a throwaway hub before enabling it |\n\n`<agent>` is the file name in `kit/agents/` (`worker`, `ui-designer`, `tester`…). See [Extensions](27-hubs-y-sesiones.md#extensions-tuning-agents-from-the-hub).\n\n**Example:** `coordinator` and `senior` get the query tool of a read-only database MCP, with a note: `SELECT` only, never write.\n\n## Outside `workspace.json`\n\n| Where | What |\n|---|---|\n| `<hub>/.openspec-store/store.yaml` | The hub's OpenSpec store id |\n| `<hub>/AGENTS.md` | Table of repos, branches, ticket format, what is forbidden (read by the orchestrator and specker) |\n| `~/.config/factory/hub` | Default hub |\n| `bin/lib/kit-settings.json` | Common settings for kit sessions (plugins turned off) |\n| `kit/.claude-plugin/plugin.json` | Kit version |\n| `kit/.mcp.json` | Kit MCPs (`local-db`) |\n| `kit/hooks/hooks.json` | Subagent and test-cleanup hooks |\n| `~/.claude/rubrics/<repo>.md` | Personal addition to the reviewer's rubric |\n| `~/.claude/testing/<repo>.md` | Personal notes for the tester and ui-tester |\n"}, {"id": "32-agentes", "file": "32-agentes.md", "title": "Agents", "md": "# Agents\n\nDefined in `kit/agents/<name>.md` (frontmatter: model, effort, tools; body: the prompt). They are invoked as `factory:<name>`, and the main sessions also as `factory <name>`. Without `tools` in the frontmatter, the agent has all the session's tools.\n\n## Main sessions\n\n| Agent | Model | Writes to | Never |\n|---|---|---|---|\n| **orchestrator** | Sonnet | `.board/requests/`, `.board/inbox/`, `.board/jared/`, `context/`, `decisions/`, `learnings/`, `BACKLOG.md`, `personal/`; with a task manager, the ticket's `Status` | Edit code, commit, create tasks in the task manager (that is Jared's job) |\n| **coordinator** | Opus | spec, `tasks.md`, `ui.md`, `result.md`; repos only via ship/review-loop/resolve-conflicts | Write code except a trivial line; switch branches; archive |\n| **senior** | Fable | what the coordinator writes + `design-plan.md` and the foundations in the repo (theme, tokens, a reference component) | The same as the coordinator, except the foundations; ship without review |\n| **jared** | Sonnet | Task-manager tasks (via task-creator), `personal/backlog/`, `personal/drafts/` | Edit code or OpenSpec; start the work |\n| **auditor** | Sonnet | `audits/<repo>/<date>-<types>/` | Modify the audited repo or run its code |\n| **changelog** | Sonnet | `changelogs/<date>/` (HTML page using the hub's template, `CHANGELOG.md`, videos) | Edit code; list tasks instead of new features; record without your \"yes\"; change the template's design |\n\n## Subagents\n\n| Agent | Model · effort | Tools | Modes | Input | Output |\n|---|---|---|---|---|---|\n| **specker** | Sonnet · medium | Read, Grep, Glob, Bash, Write, Edit, Notion (read) | — | task, store, hub, request, folders | written spec (with Risk) + summary + questions with a default value |\n| **scout** | Haiku · low | Read, Grep, Glob, Bash | — | concrete questions | conclusions with `path:line` |\n| **ui-designer** | Sonnet · high | Read, Grep, Glob, Bash, Skill, Write | `plan`, `critique` | `ui` repo folder, app, spec; in critique: `ui.md`, screenshots, crops, `evidence.json`, round file | `plan`: UI spec (→ `ui.md`); `critique`: `APPROVE` / `CHANGES NEEDED` + findings |\n| **worker** | per `routing` (Sonnet by default) · medium | edit, Bash, Skill, `local-db`, Figma | — | a repo's folder, plan, files, rules, how to verify | changed files, what it ran and the result, rules followed |\n| **reviewer** | per `routing` · per `routing` (high by default) | Read, Grep, Glob, Bash, Skill, Write | normal, fix round | plan, folders, lenses, gate lines, round file (+ the previous one) | `APPROVE` / `CHANGES NEEDED` + `path:line — problem — fix` |\n| **tester** | Sonnet · medium | Read, Grep, Glob, Bash | suites | folder, touched files, e2e only / scoped | `OK` / `BROKEN` / `BLOCKED` + `guideNotes` |\n| **ui-tester** | Sonnet · medium | Read, Grep, Glob, Bash, `local-db` | `ui`, `capture`, `demo` | mode, plan or Capture list (in `demo`: script, name and output folder; records the raw take and its timeline), UI env, front-end folder, branch, task, screenshots directory, hub | `OK` / `BROKEN` / `BLOCKED` + flows, screenshots, video (`demo`), `needsUser`, `guideNotes` |\n| **video-editor** | Sonnet · high | Read, Grep, Glob, Bash, Write, Edit, Skill | — | raw take, `events.json`, script, title and one-line summary of the feature, the hub's `GUIDE.md` and `assets/`, format, output folder | video edited with Hyperframes (mp4, gif, poster, project) + scenes and zooms |\n| **task-creator** | Sonnet · medium | Read, Grep, Glob, Bash, Skill, Notion (read and write) | `draft`, `create`, `update` | request or findings | drafts and questions; creates only what is approved |\n\nThe Notion tools come from your own Notion MCP, not from the kit: it is part of the Notion adapter (see [Audits, task manager and learnings](26-auditorias-tareas-aprendizajes.md#task-manager-jared-and-task-creator)).\n\n## Reuse rules (coordinator)\n\n| Agent | Policy |\n|---|---|\n| worker | **One per repo for the whole task**, reused with `SendMessage` (only the delta). A new one if the reviewer rejects the approach, the change is in another area, it has had 2 fix rounds, its context goes past ~60k tokens or its id was lost. Never two at once in the same repo. |\n| reviewer | Always new; from round 2 it receives the previous round's file. |\n| tester, ui-tester, video-editor | Always new. |\n| ui-designer | New for each critique; receives the previous critique if it blocked. |\n| specker | The same one, to answer your questions. |\n\n## Kit skills\n\n| Skill | Loaded by | Purpose |\n|---|---|---|\n| `ui-test` | coordinator, on tasks with a screen | UI spec, on-screen test plan, ui-tester, critique and when it is ready |\n| `ship` | coordinator | Commit, push, PR and screenshots |\n| `review-loop` | coordinator | Review comments on the PR |\n| `resolve-conflicts` | coordinator | Conflicts with the base |\n| `retro` | coordinator, anyone with `/factory:retro` | Learnings with your approval |\n| `worktrees` | tester, ui-tester, worker | Worktree model, the hub's `task-servers` contract, shared backend and DBs |\n| `herdr` | orchestrator | Read and send messages to coordinators without breaking your panes |\n| `tech-task-creator` | task-creator | Team guide for creating tasks in Notion |\n| `security-audit` (Cloudflare, MIT, vendored) | auditor | Security audit |\n| `impeccable` (pbakaus, Apache 2.0, vendored) | ui-designer | UX/UI judgment |\n\nVendored skills carry a `LICENSE` and an `UPSTREAM` file (source repo and commit).\n\n**Hub skills** (`<hub>/.claude/skills/`) also load in every session of that hub, including those in `.tasks/<task>/`. **Example:** a `docker` skill that says what can be done with the hub's local stack and how to tell a backend that is recompiling from a broken one.\n"}, {"id": "33-limites", "file": "33-limites.md", "title": "Known limits", "md": "# Known limits\n\nState as of 2026-11-01. When one is fixed, it is removed from here. The engine's general pending work is in `EXPORT.md`.\n\n## Engine\n\n- **Little mileage outside its original projects.** Since the engine was split from the hub (2026-10-30), full tasks have run end to end: spec, ui-designer, worktree with its own servers, gate, on-screen test, PR and review. Missing: a project with a different stack and a task with `ui` and `api` at the same time.\n- **The Notion adapter assumes a specific setup.** The tracker is pluggable (`tracker.type`, [`trackers/README.md`](../trackers/README.md)), but Notion's pieces (the `notion` panel, `bin/inbox`, `bin/notion-page`, Jared, `task-creator`, `tech-task-creator`) assume a tasks database with `Status`, `Priority`, `SPs` and `Assignee` properties, ticket ids like `<idPrefix>-<n>` (`notion.idPrefix`) and the `notion` MCP. Another tracker gets the four operations of its `TRACKER.md` (read a ticket, read a status, list pending work, move a status); it has no panel or creator agent unless the hub adds them.\n- **Prompts with stack assumptions.** Prompts no longer name any project's stack; what is specific to each hub goes in its `AGENTS.md`, guides, commands and skills (for example a hub's own `task-servers` and `docker`). The Notion adapter is the remaining exception (above).\n- **A kit change does not reach running sessions**: you have to restart them (and `factory hub-panel --replace` for the panels).\n\n## Cursor\n\nTested: it loads the kit, delegates to our subagents and translates models. Not yet tested: a task end to end. The coordinator of a new task starts in Cursor when a Claude window is at 95% or more, without changing the orchestrator's provider. With Claude down, `factory provider cursor` also starts the orchestrator in Cursor CLI (restart it); `notion-page` still calls `claude -p`.\n\n- **Subagents use the model of the agent that launches them** if the coordinator does not pass them a provider id: Cursor ignores the `model:` of a plugin's agents and the names `haiku`/`sonnet`/`opus`. The \"Environment\" section carries the map and the hub's already-translated `routing` table, and tells it that a rejected id is replaced by another of the same level (low, medium, high), not by its own. The scout stops at 25 turns through the prompt: this provider does not apply `maxTurns`.\n- **An agent with invalid frontmatter is not registered.** An unquoted description containing `:` makes Cursor skip the file: it happened to `ui-designer`, `ui-tester`, `auditor` and `task-creator`. The coordinator does not search the repo either; that is the scout's job.\n- **No Claude Code-specific tools** (`SendMessage`, `Monitor`, `ScheduleWakeup`, `AskUserQuestion`): the coordinator launches a new worker where it would reuse one.\n- **`factory usage` is still Claude's.** A Cursor session does not write that meter. The `agentes` panel, `factory ctx`, the stalled-task notice and `pr-watch` compaction read the Cursor transcript (`/summarize` when what is recorded passes ~100k tokens; Cursor does not store real usage, so that figure is the transcript text). The kit hooks do not run there; test cleanup is still done by `sys-watch` every minute.\n- `notion-page` still uses `claude -p`.\n\n## On-screen test\n\n- **`ui` + `api` of the same task are not tested together on screen.** With `uiEnv: demo`, flows that need the new backend go to manual QA. With `local`, it only works if the task is in your main checkout of the `api` repo. Planned way out: an ephemeral environment per PR.\n- **States that require clicks** (dialogs, menus, tabs) need a custom script from the tester, which is the most fragile part.\n- **A `ui` repo linked to the main checkout is not pointed at demo**: it uses your local config, even if the coordinator believes it is demo.\n\n## Quality\n\n- **The reviewer does not catch every convention** that review bots or you later ask for (duplicated logic, tokens, file separation). What only CI checks shows up on the PR.\n- **Optional findings are parked on purpose** and sometimes come back in the PR review as one more round.\n- **Design critique is new** (wireframe, crops, measurements): still little validated on real tasks.\n- **Default decisions** (`approvals: auto`) are recorded as \"unconfirmed\" and appear under \"⚠ Requires attention\", but nothing forces you to review them.\n\n## Local environment\n\n- **A single shared local DB**: a recreated container can reseed it for everyone. The rules forbid it without your \"yes\" and the `servidores` panel does not offer it unless no container exists at all, but an agent with Bash could still run it.\n- **Long pre-push hooks** (building and testing a whole monorepo) time out under load; it retries once. Making them incremental is up to the repo, not the engine.\n\n**Example:** a project's own limits (flaky e2e tests of a service against the same DB and Redis, front-end components that render badly, shared users in demo) are not the engine's: they go in the hub's `learnings/`.\n\n## Process\n\n- **`factory audit-start` requires a git repo**: auditing the hub itself is done by hand with reviewers.\n"}, {"id": "34-best-practices", "file": "34-best-practices.md", "title": "Best practices", "md": "# Best practices\n\nHow to get reliable results from the factory, and how to keep it safe when you are not watching. Each point says what to do and where the factory already helps. The security points are rules the harness enforces; the rest are habits.\n\n## Be in the loop less, but know what replaced you\n\nWhen you stop approving every step, something else has to do it. In the factory that is:\n\n| You used to… | Now… |\n|---|---|\n| steer the model mid-session | the spec and plan (`approvals` in `workspace.json`) say what \"done\" means before work starts |\n| approve every command | the permission mode of the session plus `deny` rules |\n| read every change | the gate (`factory gate`), the reviewer, the tester and CI |\n| start every session | the orchestrator launches one coordinator per task |\n\nHand over one step at a time. Start with `approvals.spec: \"ask\"` and `ship: \"ask\"`; once a kind of task keeps coming out right, move it to `auto`.\n\n## Safety: what is enforced and what is a request\n\nA line in a prompt or `AGENTS.md` (\"never read `.env`\") is a request to the model. Only the harness can guarantee something.\n\n- **`deny` rules come first.** `bin/lib/kit-settings.json` carries `deny` rules for `.env` and `.env.*`. Claude Code checks them before anything else, so no tool call that matches them runs. Add a rule for anything that is hard to take back: deleting uncommitted work, reading credentials, writing to production. If Claude gets it wrong once and you can revert it, a prompt is enough; if you cannot, make it a rule.\n- **A rule limits the call, not what the call reaches.** `npm test` is allowed, but a compromised dependency it runs can still open files. A sandbox (the operating system enforcing which files, folders and hosts a command may touch) is what limits that. It covers shell commands only, not MCP servers or hooks.\n- **Give an agent only the tools it needs.** `agents.<agent>.tools` adds tools to one agent, not to all. A database MCP pointed at production belongs on one agent, read-only, with a note saying so (`agents.<agent>.notes`).\n- **Keep secrets out of the repos you link.** Scripts copy `.env*` files into worktrees without opening them. Never paste a secret into a task, a spec or a PR description.\n- **The machine is disposable, what leaves it is not.** A pushed commit or a message sent through a connector cannot be pulled back. Keep `ship: \"ask\"` until you trust the gate.\n\n## Verification: make \"done\" something that passes or fails\n\nWithout you reading every change, \"done\" has to be something a machine can check.\n\n- **Write what done looks like in the task.** Ask for tests per sub-task and for the real output to be shown, since you were not there to see it.\n- **Use the gate for checks that must always run.** `workspace.json` → `gate.repos.<repo>.checks` runs before any reviewer. Prompts can be skipped by a model; the gate cannot.\n- **Protect the tests.** `gate.protected` flags edits to test and lint config, so a failing check is not \"fixed\" by weakening it.\n- **A check that fails must exit with a non-zero code a hook or script acts on.** In Claude Code hooks, exit code `2` sends the model back to fix the problem; exit code `1` does not. If you add your own hooks, use `2`.\n- **Review with a fresh context.** The reviewer is a separate agent that did not write the code. Keep it that way; do not ask the worker to review itself.\n- **Let CI be the common net.** Every task ends in a PR, and CI runs the same checks however the session was set up. Turn on the review loop (`reviewLoop`) so a failing check goes back to the coordinator.\n- **Scale review to risk.** Docs and copy changes can merge when checks are green; ordinary changes need one reviewer; migrations, auth and infra changes deserve two. The `gate.attention` patterns flag these for you.\n\n## Keep instructions short\n\n- **`AGENTS.md` holds what the model cannot see in the code**: where a task goes, rules that are not obvious, systems that are not referenced anywhere. Not the stack, not \"where to look\".\n- **Avoid shouting.** Capitals, `IMPORTANT` and `NEVER` in prompts tend to send current models off course and add tool calls. State the rule and the reason once.\n- **Put project facts in the hub, not in the engine.** A prompt in `kit/` says \"the repo with role `ui`\", never a repo name. This keeps one engine usable for many projects.\n- **Write down what was costly to learn.** `factory retro` turns a finished task into dated lines in `learnings/`; the coordinator and specker read them before planning.\n\n## Run it in a way you can recover from\n\n- **Test engine changes in a throwaway hub.** A task dropped in a live hub's `.board/inbox/` is executed. Use `factory hub-init <scratch>/x probe-x`, then `openspec store unregister probe-x`.\n- **Restart after changing the engine.** Open orchestrators and coordinators keep the kit they started with; open panels keep their command. See [Hubs, sessions and extensions](27-hubs-y-sesiones.md).\n- **One task, one worktree.** Do not let two tasks share a working folder; `factory task-start` prepares each one. Use `factory task-move` when you want to try a task in your main checkout.\n- **Watch cost and limits.** `factory usage` shows the account's usage window. With the Cursor provider configured, new coordinators can move there when a Claude window is nearly spent.\n\n## Experimental: Code Mode\n\nCode Mode (a Claude Code feature, off by default) lets a session write JavaScript that chains tool calls and returns only the result, instead of reading every intermediate output. It can lower tokens on repetitive search-and-edit work, and it is a poor fit for a single command.\n\n- Turn it on per agent: `\"agents\": { \"worker\": { \"codeMode\": true } }` in `workspace.json` (see [Configuration](31-configuracion.md)).\n- It needs an interactive `claude` session and a Claude account; it does not work through `claude -p`, other providers, or sessions that need Claude in Chrome or computer use.\n- Try it in a throwaway hub first, compare `/cost` with and without it on the same task, and read the scripts with `Ctrl+O`.\n- Treat it as unstable: the feature may change or disappear in any Claude Code release.\n\n## A good first week\n\n1. Install, create a hub, link one repo, and run one small task with `ship: \"ask\"`.\n2. Read the spec, the plan and the review of that task end to end once, to learn what each agent produces.\n3. Fill in `gate.repos.<repo>.checks` with your real lint, type and test commands.\n4. Add `deny` rules for what you could not undo, and put your repo map and non-obvious rules in the hub's `AGENTS.md`.\n5. Run a few tasks of the same kind; when they come out right, relax one `ask` to `auto`.\n"}]</script>
<script>
const PAGES = JSON.parse(document.getElementById('pages').textContent)
const $ = (s) => document.querySelector(s)
// GitHub-style heading ids, so links like 24-calidad.md#gate keep working.
const slug = (t) => t.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s/g, '-')
// Pages are grouped by the first digit of their file name: 1x Empezar (numbered steps), 2x Conceptos, 3x Referencia.
const GROUPS = { 1: 'Empezar', 2: 'Conceptos', 3: 'Referencia' }
const STEPS = PAGES.filter((p) => p.id[0] === '1')
const num = (p) => p.id[0] === '1' ? String(STEPS.indexOf(p) + 1) : ''
const label = (p) => p.id === 'inicio' ? 'Home' : p.title.replace(/`/g, '')
const CODE_LABEL = { sh: 'terminal', bash: 'terminal', json: 'json', text: 'output', markdown: 'markdown', toml: 'toml', yaml: 'yaml' }

// Theme: system by default, a manual choice is remembered on this browser.
const stored = (() => { try { return localStorage.getItem('docs-theme') } catch { return null } })()
if (stored) document.documentElement.dataset.theme = stored
const isDark = () => document.documentElement.dataset.theme === 'dark' ||
  (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)
$('#theme').onclick = () => {
  const next = isDark() ? 'light' : 'dark'
  document.documentElement.dataset.theme = next
  try { localStorage.setItem('docs-theme', next) } catch {}
  route()
}

function sidebar(query = '') {
  const q = query.trim().toLowerCase()
  let last = null
  $('#side').innerHTML = PAGES.map((p) => {
    const hits = q ? p.md.toLowerCase().split(q).length - 1 : 0
    if (q && !hits) return ''
    const g = GROUPS[p.id[0]], head = g && g !== last ? `<div class="group">${g}</div>` : ''
    last = g
    const n = num(p)
    return head + `<a href="#${p.id}" data-id="${p.id}">${n ? `<span class="num">${n}</span>` : ''}${label(p)}${q ? `<span class="hits">${hits}</span>` : ''}</a>`
  }).join('') || '<p class="empty">No results</p>'
  markActive()
}
const currentId = () => decodeURIComponent(location.hash.slice(1)) || 'inicio'
function markActive() {
  document.querySelectorAll('#side a').forEach((a) => a.classList.toggle('active', a.dataset.id === currentId()))
}

// Wraps each "## …" and what follows it, up to the next "##", in a <section>.
function sections(el) {
  [...el.querySelectorAll(':scope > h2')].forEach((h) => {
    const s = document.createElement('section')
    h.before(s)
    let n = h
    while (n && !(n !== h && n.tagName === 'H2')) { const next = n.nextElementSibling; s.append(n); n = next }
  })
  return [...el.querySelectorAll(':scope > section')]
}

let pendingAnchor = null
async function route() {
  const i = Math.max(0, PAGES.findIndex((p) => p.id === currentId()))
  const page = PAGES[i]
  const el = $('#content')
  el.innerHTML = marked.parse(page.md, { gfm: true })

  // Links between pages → #page (an anchor travels in data-anchor); links outside docs/ stay relative files.
  el.querySelectorAll('a[href]').forEach((a) => {
    const m = a.getAttribute('href').match(/^(?:\.\/)?([\w-]+)\.md(?:#(.*))?$/)
    if (m) { a.href = `#${m[1] === 'README' ? 'inicio' : m[1]}`; if (m[2]) a.dataset.anchor = decodeURIComponent(m[2]) }
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener' }
  })
  el.querySelectorAll('table').forEach((t) => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.append(t) })

  // Mermaid blocks; every other block gets its label bar and a copy button.
  el.querySelectorAll('code.language-mermaid').forEach((c) => { const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent; c.parentElement.replaceWith(d) })
  el.querySelectorAll('pre').forEach((pre) => {
    const lang = ((pre.firstElementChild?.className || '').match(/language-(\w+)/) || [])[1] || ''
    const box = document.createElement('div')
    box.className = 'code' + (CODE_LABEL[lang] === 'terminal' ? ' term' : '')
    box.innerHTML = `<div class="bar"><span>${CODE_LABEL[lang] || lang || 'code'}</span><button type="button">Copy</button></div>`
    pre.replaceWith(box); box.append(pre)
  })

  const heads = [...el.querySelectorAll('h2, h3')]
  heads.forEach((h) => { h.id = slug(h.textContent); h.dataset.label = h.textContent; h.insertAdjacentHTML('beforeend', `<a class="anchor" href="#${page.id}" data-anchor="${h.id}" aria-label="Link to this section">#</a>`) })

  // Getting-started pages: progress, numbered steps on a rail, and the closing check.
  const step = STEPS.indexOf(page)
  if (step >= 0) {
    el.insertAdjacentHTML('afterbegin', `<div class="crumb">Empezar <span class="bar"><i style="width:${(step + 1) / STEPS.length * 100}%"></i></span><span class="of">Paso ${step + 1} de ${STEPS.length}</span></div>`)
    sections(el).forEach((s) => {
      const h = s.firstElementChild, m = h.firstChild.nodeValue?.match(/^(\d+)\.\s*/)
      if (m) { s.className = 'step'; h.firstChild.nodeValue = h.firstChild.nodeValue.slice(m[0].length); h.insertAdjacentHTML('afterbegin', `<span class="n">${m[1]}</span>`) }
      else if (/^Comprobar/.test(h.textContent)) s.className = 'check'
    })
    ;[...el.querySelectorAll('section.step')].pop()?.classList.add('last')
  }

  // Highlight the search term on the page.
  const q = $('#search').value.trim()
  if (q) {
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: (n) => n.parentElement.closest('pre, .mermaid, .bar') ? 2 : 1 })
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), nodes = []
    while (walk.nextNode()) if (re.test(walk.currentNode.nodeValue)) nodes.push(walk.currentNode)
    nodes.forEach((n) => { const s = document.createElement('span'); s.innerHTML = n.nodeValue.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]).replace(re, (x) => `<mark>${x}</mark>`); n.replaceWith(s) })
  }

  mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'neutral', securityLevel: 'strict', fontFamily: 'IBM Plex Sans, system-ui, sans-serif' })
  await mermaid.run({ nodes: el.querySelectorAll('.mermaid') }).catch(() => {})

  // Previous / next. On the getting-started path, "next" is the call to action.
  const prev = PAGES[i - 1], next = PAGES[i + 1]
  const tag = (p, dir) => p.id[0] === '1' ? `${dir} · Paso ${num(p)}` : dir
  el.insertAdjacentHTML('beforeend', `<nav class="pager">${prev ? `<a href="#${prev.id}"><small>${tag(prev, '← Previous')}</small>${label(prev)}</a>` : ''}${next ? `<a class="next${step >= 0 || page.id === 'inicio' ? ' go' : ''}" href="#${next.id}"><small>${tag(next, 'Next →')}</small>${label(next)}</a>` : ''}</nav>`)

  // On-this-page table of contents, highlighting the section in view.
  $('#toc').innerHTML = heads.length ? '<div class="label">On this page</div>' + heads.map((h) => `<a class="${h.tagName.toLowerCase()}" href="#${page.id}" data-anchor="${h.id}">${h.dataset.label}</a>`).join('') : ''
  document.title = page.id === 'inicio' ? 'Factory Docs' : `${label(page)} · Factory Docs`
  markActive()
  document.body.classList.remove('menu-open'); $('#menu').setAttribute('aria-expanded', 'false')
  const target = pendingAnchor && document.getElementById(pendingAnchor)
  pendingAnchor = null
  target ? target.scrollIntoView() : window.scrollTo(0, 0)
}

// Section links: the hash only names the page; the section is scrolled to here.
document.addEventListener('click', (e) => {
  const copy = e.target.closest('.code .bar button')
  if (copy) {
    const text = copy.closest('.code').querySelector('pre').innerText
    const done = () => { copy.textContent = 'Copied'; copy.classList.add('done'); setTimeout(() => { copy.textContent = 'Copy'; copy.classList.remove('done') }, 1600) }
    const select = () => { const r = document.createRange(); r.selectNodeContents(copy.closest('.code').querySelector('pre')); getSelection().removeAllRanges(); getSelection().addRange(r) }
    try { navigator.clipboard.writeText(text).then(done, select) } catch { select() }
    return
  }
  const a = e.target.closest('a[data-anchor]')
  if (!a) return
  e.preventDefault()
  const page = a.getAttribute('href').slice(1)
  if (page === currentId()) document.getElementById(a.dataset.anchor)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
  else { pendingAnchor = a.dataset.anchor; location.hash = page }
})
addEventListener('scroll', () => {
  let cur = null
  document.querySelectorAll('#content h2, #content h3').forEach((h) => { if (h.getBoundingClientRect().top < 120) cur = h.id })
  document.querySelectorAll('#toc a').forEach((a) => a.classList.toggle('active', a.dataset.anchor === cur))
}, { passive: true })
addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#search').focus() }
  if (e.key === 'Escape' && document.activeElement === $('#search')) { $('#search').value = ''; sidebar(); route(); $('#search').blur() }
})

$('#search').addEventListener('input', (e) => { sidebar(e.target.value); route() })
$('#menu').onclick = () => { const open = document.body.classList.toggle('menu-open'); $('#menu').setAttribute('aria-expanded', String(open)) }
addEventListener('hashchange', route)
// Old links (#/page/anchor) still land on the page.
if (location.hash.startsWith('#/')) { const [p, a] = location.hash.slice(2).split('/'); pendingAnchor = a ? decodeURIComponent(a) : null; history.replaceState(null, '', '#' + p) }
sidebar(); route()
</script>
</body>

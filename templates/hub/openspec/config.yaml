schema: factory

context: |
  {{name}} hub. One change = one task, possibly across repos.
  Repos, base branches and naming: AGENTS.md. Domain vocabulary: context/glossary.md. Architecture: context/architecture.md.
  Each repo's AGENTS.md holds its rules; specs describe behaviour, not code style.

rules:
  proposal:
    - Write prose in English; keep code identifiers, paths and endpoints as they are
  tasks:
    - Never include commit, push or PR tasks (shipping is a separate step)
    - 'Never include manual or by-hand QA tasks (they block the change); list manual checks in the proposal under **Decisions / Out of scope** as "Manual QA: …"'
